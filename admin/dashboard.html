<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM | 관리자 센터</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-main { padding: 8rem 4rem; max-width: 1200px; margin: 0 auto; }
        .admin-section { margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: 12px; background: white; overflow: hidden; }
        .section-header { 
            padding: 1.5rem 2rem; background: var(--bg-light); cursor: pointer; 
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s; border-bottom: 1px solid transparent;
        }
        .section-header:hover { background: #F0F2F5; }
        .section-header h2 { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .section-header .toggle-icon { font-size: 0.8rem; color: var(--text-muted); transition: 0.3s; }
        .section-content { padding: 2.5rem; display: none; border-top: 1px solid var(--border); }
        .admin-section.active .section-header { border-bottom-color: var(--border); background: white; }
        .admin-section.active .section-content { display: block; }
        .admin-section.active .toggle-icon { transform: rotate(180deg); }

        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 1.2rem; text-align: left; border-bottom: 1px solid var(--border); }
        .admin-table th { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.1em; font-weight: 800; }
        .admin-table td { font-size: 0.85rem; vertical-align: middle; }
        .admin-actions { display: flex; gap: 1rem; }
        .admin-actions a, .admin-actions button { background: none; border: none; color: var(--sori-muted); cursor: pointer; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; }
        .admin-actions a:hover { color: var(--primary); }
        .admin-actions .del-btn:hover { color: #ff4d4d; }

        .glass-box { background: var(--bg-light); padding: 2rem; border: 1px solid var(--border); border-radius: 8px; }
        input, select, textarea { background: white; border: 1px solid var(--border); color: var(--text-main); padding: 0.8rem; border-radius: 4px; font-family: inherit; width: 100%; margin-top: 0.5rem; font-size: 0.95rem; }
        label { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        
        .board-selector { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem; }
        .board-btn { padding: 0.6rem 1.5rem; border: 1px solid var(--border); background: white; font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 30px; transition: 0.3s; }
        .board-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .usage-bar { width: 100%; height: 6px; background: #EEE; border-radius: 3px; overflow: hidden; margin: 0.8rem 0; }
        .usage-fill { height: 100%; background: var(--primary); transition: 0.5s; }
        .sort-btn { padding: 4px 10px; background: #EEE; border: 1px solid #DDD; cursor: pointer; font-size: 0.7rem; border-radius: 4px; font-weight: 700; }

        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .asset-card { background: white; border: 1px solid var(--border); padding: 0.8rem; text-align: center; border-radius: 8px; }
        .asset-card img, .asset-card video { width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 0.8rem; border-radius: 4px; }
        .asset-card p { font-size: 0.6rem; color: var(--text-muted); word-break: break-all; margin-bottom: 0.8rem; }
    </style>
</head>
<body class="bg-surface">
    <nav id="global-nav" class="scrolled">
        <a href="/" class="brand">SORIGRIM</a>
        <div class="nav-links">
            <a href="javascript:logout();" style="font-size: 0.85rem; color: #ff4d4d; font-weight: 800;">LOGOUT</a>
            <a href="/admin/dashboard.html">관리 홈</a>
            <a href="/admin/editor.html" class="btn-premium" style="padding: 0.6rem 1.5rem; font-size: 0.85rem;">새 글 작성</a>
        </div>
    </nav>

    <main class="admin-main container">
        <!-- 01. 게시판 관리 -->
        <div class="admin-section" id="sec-category">
            <header class="section-header" onclick="toggleSection('sec-category')">
                <h2>01. 게시판 및 순서 설정</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <form id="category-form" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <input type="text" id="cat-name" placeholder="새 게시판 이름" required>
                    <button type="submit" class="btn-premium" style="width:auto; padding: 0 2rem;">추가</button>
                </form>
                <div id="category-list-ui" style="display: flex; flex-direction: column; gap: 0.8rem;"></div>
            </div>
        </div>

        <!-- 02. 게시글 관리 -->
        <div class="admin-section active" id="sec-posts">
            <header class="section-header" onclick="toggleSection('sec-posts')">
                <h2>02. 게시글 통합 관리</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <div class="board-selector" id="board-selector-ui"></div>
                <div class="glass-box" style="padding: 0; background: none; border: none;">
                    <table class="admin-table">
                        <thead><tr><th>썸네일</th><th>상태</th><th>제목</th><th>관리</th></tr></thead>
                        <tbody id="admin-list"><tr><td colspan="4" style="text-align:center; padding:4rem; color:#999;">게시판을 선택하세요.</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 03. 프로필 관리 -->
        <div class="admin-section" id="sec-profile">
            <header class="section-header" onclick="toggleSection('sec-profile')">
                <h2>03. 프로필(About) 관리</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <form id="profile-form" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div><label>이름/타이틀</label><textarea data-key="profile_name" rows="2"></textarea></div>
                        <div><label>이미지 URL</label><input type="url" data-key="profile_image"></div>
                    </div>
                    <div><label>소개 문단 1</label><textarea data-key="profile_bio_1" rows="3"></textarea></div>
                    <div><label>소개 문단 2</label><textarea data-key="profile_bio_2" rows="3"></textarea></div>
                    <button type="submit" class="btn-premium" style="width: 150px; padding: 0.8rem;">프로필 저장</button>
                </form>
            </div>
        </div>

        <!-- 04. 사이트 문구 설정 -->
        <div class="admin-section" id="sec-texts">
            <header class="section-header" onclick="toggleSection('sec-texts')">
                <h2>04. 사이트 주요 문구 설정</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <form id="site-text-form" style="display: flex; flex-direction: column; gap: 2rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                        <div><label>메인 히어로 타이틀</label><textarea data-key="site_hero_title" rows="2"></textarea></div>
                        <div><label>메인 히어로 서브설명</label><textarea data-key="site_hero_sub" rows="2"></textarea></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                        <div><label>추천 섹션 제목</label><input type="text" data-key="site_rec_title"></div>
                        <div><label>추천 섹션 설명</label><input type="text" data-key="site_rec_desc"></div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                        <div><label>아카이브 페이지 제목</label><input type="text" data-key="site_archive_title"></div>
                        <div><label>푸터 브랜드 설명</label><textarea data-key="site_footer_desc" rows="2"></textarea></div>
                    </div>
                    <button type="submit" class="btn-premium" style="width: 150px; padding: 0.8rem;">문구 설정 저장</button>
                </form>
            </div>
        </div>

        <!-- 05. 스토리지 탐색기 -->
        <div class="admin-section" id="sec-explorer">
            <header class="section-header" onclick="toggleSection('sec-explorer')">
                <h2>05. 업로드 이미지 관리 (스토리지 탐색기)</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content"><div id="asset-list" class="asset-grid"></div></div>
        </div>

        <!-- 06. 리소스 현황 -->
        <div class="admin-section" id="sec-storage">
            <header class="section-header" onclick="toggleSection('sec-storage')">
                <h2>06. 리소스 사용량 현황</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem;">
                    <div class="glass-box"><label>R2 Media Storage</label><div id="r2-usage-text" style="font-size: 1.5rem; font-weight: 900; margin: 0.5rem 0;">0 MB / 10 GB</div><div class="usage-bar"><div id="r2-usage-fill" class="usage-fill" style="width: 0%;"></div></div><p id="r2-count" style="font-size: 0.7rem; color:#999;">0 files</p></div>
                    <div class="glass-box"><label>D1 Database</label><div id="d1-usage-text" style="font-size: 1.5rem; font-weight: 900; margin: 0.5rem 0;">정상</div><div class="usage-bar"><div id="d1-usage-fill" class="usage-fill" style="width: 1%;"></div></div><p id="d1-counts" style="font-size: 0.7rem; color:#999;">Posts: 0 | Categories: 0</p></div>
                </div>
            </div>
        </div>

        <!-- 07. 보안 설정 -->
        <div class="admin-section" id="sec-security">
            <header class="section-header" onclick="toggleSection('sec-security')">
                <h2>07. 보안 및 SNS 관리</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <form id="password-form" style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 3rem;">
                    <div style="flex:1;"><label>관리자 비밀번호 변경</label><input type="password" id="new-password"></div>
                    <button type="submit" class="btn-premium" style="width:auto; padding: 0 2.5rem;">변경</button>
                </form>
                <form id="sns-form" style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 2rem;"><div style="flex:1;"><input type="text" id="sns-key" placeholder="플랫폼 이름"></div><div style="flex:2;"><input type="url" id="sns-value" placeholder="URL"></div><button type="submit" class="btn-premium" style="width:auto; padding: 0 2rem;">추가</button></form>
                <table class="admin-table"><thead><tr><th>플랫폼</th><th>URL</th><th>관리</th></tr></thead><tbody id="sns-admin-list"></tbody></table>
            </div>
        </div>

        <!-- 08. 방문 통계 분석 -->
        <div class="admin-section" id="sec-stats">
            <header class="section-header" onclick="toggleSection('sec-stats')">
                <h2>08. 방문 통계 분석</h2>
                <span class="toggle-icon">▼</span>
            </header>
            <div class="section-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 3rem;">
                    <div class="glass-box"><label>누적 페이지 뷰</label><div id="total-views" style="font-size: 2.2rem; font-weight: 900; color: var(--primary);">0</div></div>
                    <div class="glass-box"><label>오늘의 유니크 방문자</label><div id="today-unique" style="font-size: 2.2rem; font-weight: 900; color: #28a745;">0</div></div>
                </div>
                <!-- 표 영역을 넓게 배치하여 잘림 방지 -->
                <div style="display: flex; flex-direction: column; gap: 3rem;">
                    <div class="glass-box" style="width: 100%;">
                        <label>🔥 인기 작품 Top 10 (게시글 기준)</label>
                        <table style="width: 100%; font-size: 0.9rem; margin-top: 1.5rem; border-collapse: collapse;">
                            <tbody id="top-posts-list"></tbody>
                        </table>
                    </div>
                    <div class="glass-box" style="width: 100%;">
                        <label>🔗 주요 유입 경로 (Top Referral)</label>
                        <table style="width: 100%; font-size: 0.9rem; margin-top: 1.5rem; border-collapse: collapse;">
                            <tbody id="top-referrers-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        let currentBoard = null;
        let categoriesData = [];

        window.logout = () => { document.cookie = "sg_auth_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;"; window.location.href = "/login.html"; };
        window.toggleSection = (id) => { document.getElementById(id).classList.toggle('active'); if(id === 'sec-explorer') loadAssets(); };

        // --- Core Functions ---
        async function loadCategories() {
            const res = await fetch('/api/categories'); categoriesData = await res.json();
            document.getElementById('category-list-ui').innerHTML = categoriesData.map((cat, idx) => `<div style="background:#F8F9FA; border:1px solid var(--border); padding:0.8rem 1.5rem; border-radius:8px; display:flex; align-items:center; justify-content:space-between;"><span style="font-weight:800; font-size:0.95rem;">${cat.name}</span><div style="display:flex; gap:0.5rem;"><button class="sort-btn" onclick="renameCategory(${cat.id}, '${cat.name}')">이름수정</button><button class="sort-btn" onclick="moveCategory(${idx}, -1)">▲</button><button class="sort-btn" onclick="moveCategory(${idx}, 1)">▼</button><button onclick="deleteCategory(${cat.id})" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-weight:900; margin-left:1rem;">×</button></div></div>`).join('');
            document.getElementById('board-selector-ui').innerHTML = categoriesData.map(cat => `<button class="board-btn ${currentBoard === cat.name ? 'active' : ''}" onclick="selectBoard('${cat.name}')">${cat.name}</button>`).join('');
        }
        window.renameCategory = async (id, old) => { const n = prompt('이름 수정:', old); if(n && n!==old) { await fetch(`/api/categories?id=${id}`, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:n}) }); await loadCategories(); } };
        window.moveCategory = async (idx, dir) => { const tidx = idx + dir; if(tidx < 0 || tidx >= categoriesData.length) return; const items = [...categoriesData]; [items[idx], items[tidx]] = [items[tidx], items[idx]]; await fetch('/api/categories', { method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items: items.map((it, i) => ({id:it.id, sort_order:i}))}) }); await loadCategories(); };
        window.selectBoard = (name) => { currentBoard = name; document.querySelectorAll('.board-btn').forEach(b => b.classList.toggle('active', b.innerText === name)); loadAdminList(name); };
        document.getElementById('category-form').onsubmit = async (e) => { e.preventDefault(); await fetch('/api/categories', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: document.getElementById('cat-name').value}) }); e.target.reset(); loadCategories(); };
        window.deleteCategory = async (id) => { if(confirm('삭제하시겠습니까?')) { await fetch(`/api/categories?id=${id}`, { method: 'DELETE' }); loadCategories(); } };

        async function loadAdminList(cat) {
            const list = document.getElementById('admin-list'); list.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:4rem; color:#999;">로딩 중...</td></tr>';
            const res = await fetch(`/api/portfolio?admin=true&category=${encodeURIComponent(cat)}`); const data = await res.json();
            if(data.length === 0) { list.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:4rem; color:#999;">글이 없습니다.</td></tr>`; return; }
            list.innerHTML = data.map(item => {
                const isVideo = item.image && item.image.toLowerCase().match(/\.(mp4|webm|ogg)$/);
                const mediaHtml = isVideo ? `<video src="${item.image}" muted style="width: 50px; height: 50px; object-fit: cover;"></video>` : `<img src="${item.image || ''}" style="width: 50px; height: 50px; object-fit: cover;">`;
                const statusHtml = item.is_published ? '<span style="color:#28a745; font-weight:800;">[게시]</span>' : '<span style="color:#ffc107; font-weight:800;">[임시]</span>';
                return `<tr><td>${mediaHtml}</td><td>${statusHtml}</td><td style="font-weight:700;">${item.title}</td><td class="admin-actions"><a href="editor.html?id=${item.id}">수정</a><button class="del-btn" onclick="deleteItem(${item.id})">삭제</button></td></tr>`;
            }).join('');
        }
        window.deleteItem = async (id) => { if(confirm('삭제?')) { await fetch(`/api/portfolio?id=${id}`, { method: 'DELETE' }); if(currentBoard) loadAdminList(currentBoard); loadStats(); } };

        async function loadStats() {
            try {
                const res = await fetch('/api/stats'); const d = await res.json();
                document.getElementById('total-views').innerText = d.analytics.totalViews.toLocaleString();
                const today = new Date().toISOString().split('T')[0];
                const tUnique = d.analytics.dailyUnique.find(u => u.date === today)?.count || 0;
                document.getElementById('today-unique').innerText = tUnique.toLocaleString();
                
                // 인기글 필터링 ( [작품] 으로 시작하는 항목만 추출하여 Top 10 구성 )
                const postOnly = d.analytics.topPages.filter(p => p.page.startsWith('[작품]')).slice(0, 10);
                document.getElementById('top-posts-list').innerHTML = postOnly.length ? postOnly.map(p => `<tr><td style="padding:1rem 0; border-bottom:1px solid #EEE; font-weight:700; color:var(--text-main);">${p.page.replace('[작품] ', '')}</td><td style="text-align:right; font-weight:800; color:var(--primary);">${p.count.toLocaleString()} views</td></tr>`).join('') : '<tr><td style="color:#999; text-align:center; padding:2rem;">집계된 작품 조회 데이터가 없습니다.</td></tr>';
                
                document.getElementById('top-referrers-list').innerHTML = d.analytics.topReferrers.length ? d.analytics.topReferrers.map(r => `<tr><td style="padding:1rem 0; border-bottom:1px solid #EEE; font-weight:700; word-break:break-all;">${r.referrer}</td><td style="text-align:right; font-weight:800; color:#28a745;">${r.count.toLocaleString()} visits</td></tr>`).join('') : '<tr><td style="color:#999; text-align:center; padding:2rem;">직접 유입</td></tr>';
                
                const usedMB = (d.storage.r2.used / (1024*1024)).toFixed(2);
                document.getElementById('r2-usage-text').innerText = `${usedMB} MB / 10 GB`;
                document.getElementById('r2-usage-fill').style.width = `${Math.min(100, (d.storage.r2.used/d.storage.r2.limit)*100)}%`;
                document.getElementById('r2-count').innerText = `${d.storage.r2.count} files stored`;
                document.getElementById('d1-counts').innerText = `게시글 ${d.storage.d1.posts}개 | 카테고리 ${d.storage.d1.categories}`;
                document.getElementById('d1-usage-fill').style.width = `${Math.min(100, (d.storage.d1.posts*10))}%`;
            } catch(e) {}
        }

        async function loadAssets() {
            const res = await fetch('/api/assets'); const assets = await res.json();
            document.getElementById('asset-list').innerHTML = assets.map(a => {
                const isV = a.name.toLowerCase().match(/\.(mp4|webm|ogg)$/);
                const html = isV ? `<video src="/api/assets?name=${a.name}" muted></video>` : `<img src="/api/assets?name=${a.name}" loading="lazy">`;
                return `<div class="asset-card">${html}<p>${a.name}</p><button class="del-btn" onclick="deleteAsset('${a.name}')">삭제</button></div>`;
            }).join('');
        }
        window.deleteAsset = async (n) => { if(confirm(`${n} 삭제?`)) { await fetch(`/api/assets?name=${n}`, { method: 'DELETE' }); loadAssets(); loadStats(); } };

        const loadAllInitialSettings = async () => {
            try {
                const res = await fetch('/api/settings'); const settings = await res.json();
                settings.forEach(s => { const el = document.querySelector(`[data-key="${s.key}"]`); if (el) el.value = s.value; });
            } catch (e) {}
        };

        const saveHandler = async (form, type) => {
            const elements = Array.from(form.querySelectorAll('[data-key]'));
            for (const el of elements) {
                await fetch('/api/settings', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: el.dataset.key, value: el.value, type }) });
            }
            alert('저장 완료');
        };

        document.getElementById('profile-form').onsubmit = (e) => { e.preventDefault(); saveHandler(e.target, 'profile'); };
        document.getElementById('site-text-form').onsubmit = (e) => { e.preventDefault(); saveHandler(e.target, 'site_text'); };
        document.getElementById('password-form').onsubmit = async (e) => { e.preventDefault(); await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'admin_password',value:document.getElementById('new-password').value,type:'security'})}); alert('변경완료'); e.target.reset(); };

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories(); loadStats(); loadAllInitialSettings();
            const loadSNS = async () => {
                const res = await fetch('/api/settings'); const data = await res.json();
                document.getElementById('sns-admin-list').innerHTML = data.filter(s => s.type === 'sns').map(item => `<tr><td style="font-weight:800;">${item.key}</td><td style="color:var(--text-muted);">${item.value}</td><td class="admin-actions"><button class="del-btn" onclick="deleteSNS(${item.id})">제거</button></td></tr>`).join('');
            };
            window.deleteSNS = async (id) => { if (confirm('삭제?')) { await fetch(`/api/settings?id=${id}`, { method: 'DELETE' }); loadSNS(); } };
            document.getElementById('sns-form').onsubmit = async (e) => { e.preventDefault(); await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: document.getElementById('sns-key').value, value: document.getElementById('sns-value').value, type: 'sns' }) }); e.target.reset(); loadSNS(); };
            loadSNS();
        });
    </script>
</body>
</html>
