<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorigrim | CMS</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-main { padding: 8rem 4rem; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 4rem; background: rgba(255,255,255,0.01); }
        .admin-table th, .admin-table td { padding: 1.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-table th { font-size: 0.65rem; text-transform: uppercase; color: var(--sori-muted); letter-spacing: 0.25em; font-weight: 800; }
        .admin-table td { font-size: 0.85rem; vertical-align: middle; }
        .admin-actions { display: flex; gap: 1.5rem; }
        .admin-actions a, .admin-actions button { background: none; border: none; color: var(--sori-muted); cursor: pointer; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; }
        .admin-actions a:hover { color: var(--sori-fg); }
        .admin-actions .del-btn:hover { color: #ff4d4d; }

        .section-header { margin-bottom: 3rem; border-left: 2px solid var(--sori-accent); padding-left: 2rem; }
        .section-header h2 { font-family: var(--font-editorial); font-size: 2.5rem; font-style: italic; font-weight: 400; opacity: 0.8; }
        
        .glass-box { background: rgba(255,255,255,0.02); padding: 3rem; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        input, select { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--sori-accent); outline: none; }

        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem; margin-top: 3rem; }
        .asset-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 1rem; text-align: center; }
        .asset-card img, .asset-card video { width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 1rem; opacity: 0.6; }
        .asset-card p { font-size: 0.6rem; color: var(--sori-muted); word-break: break-all; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-surface">
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="nav-links">
            <a href="/admin/dashboard.html">CMS</a>
            <a href="/admin/editor.html" class="btn-premium" style="padding: 0.6rem 1.5rem; font-size: 0.6rem;">New Post</a>
        </div>
    </nav>

    <main class="admin-main container">
        
        <!-- 1. Global Site Settings -->
        <section style="margin-bottom: 10rem;">
            <header class="section-header">
                <h2>Site Aesthetics.</h2>
            </header>
            <div class="glass-box">
                <label style="display:block; font-size:0.6rem; color:var(--sori-muted); margin-bottom:1rem; text-transform:uppercase; letter-spacing:0.2em;">Landing Hero Background (Image or Video)</label>
                <div style="display: flex; gap: 2rem; align-items: center;">
                    <input type="text" id="hero-url" placeholder="/api/assets?name=..." style="flex: 1;" readonly>
                    <input type="file" id="hero-upload" style="display: none;" accept="image/*,video/mp4">
                    <button class="btn-premium" style="padding: 1rem 2rem; font-size: 0.6rem;" onclick="document.getElementById('hero-upload').click()">Upload New Hero</button>
                </div>
                <p style="font-size: 0.6rem; color: var(--sori-muted); margin-top: 1rem;">* Images are recommended for better stability across all devices.</p>
            </div>
        </section>

        <!-- 2. Asset Storage Manager -->
        <section style="margin-bottom: 10rem;">
            <header class="section-header">
                <h2>Storage Explorer.</h2>
            </header>
            <div class="glass-box">
                <p style="font-size: 0.7rem; color: var(--sori-muted); margin-bottom: 2rem;">Manage all uploaded fragments in your R2 bucket. Remove unused files to save space.</p>
                <div id="asset-list" class="asset-grid">
                    <!-- Assets will be listed here -->
                </div>
            </div>
        </section>

        <!-- 3. Archive List -->
        <section style="margin-bottom: 10rem;">
            <header class="section-header">
                <h2>Archive Control.</h2>
            </header>
            <table class="admin-table">
                <thead>
                    <tr><th>Thumbnail</th><th>Title</th><th>Category</th><th>Actions</th></tr>
                </thead>
                <tbody id="admin-list"></tbody>
            </table>
        </section>

        <!-- 4. SNS Management -->
        <section>
            <header class="section-header">
                <h2>Social Channels.</h2>
            </header>
            <form id="sns-form" style="display: flex; gap: 1.5rem; margin-bottom: 3rem; align-items: flex-end; flex-wrap: wrap;" class="glass-box">
                <div style="flex: 1; min-width: 200px;"><input type="text" id="sns-key" placeholder="Platform Name" style="width:100%;"></div>
                <div style="flex: 2; min-width: 300px;"><input type="url" id="sns-value" placeholder="URL" style="width:100%;"></div>
                <button type="submit" class="btn-premium" style="padding: 1rem 2rem; font-size: 0.6rem;">Add Channel</button>
            </form>
            <table class="admin-table">
                <thead>
                    <tr><th>Platform</th><th>URL</th><th>Actions</th></tr>
                </thead>
                <tbody id="sns-admin-list"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        // Helper: Upload
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const res = await fetch('/api/assets', { method: 'POST', body: formData });
            const data = await res.json();
            return data.url;
        }

        // Hero Management
        async function loadHeroSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            const hero = data.find(s => s.key === 'landing_hero_video'); // Use same key for compatibility
            if (hero) document.getElementById('hero-url').value = hero.value;
        }

        document.getElementById('hero-upload').addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                const url = await uploadFile(e.target.files[0]);
                if (url) {
                    await fetch('/api/settings', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: 'landing_hero_video', value: url, type: 'config' })
                    });
                    loadHeroSettings();
                    loadAssets(); // Refresh asset list
                    alert('Hero Background Updated.');
                }
            }
        });

        // Asset Explorer
        async function loadAssets() {
            const res = await fetch('/api/assets');
            const assets = await res.json();
            const list = document.getElementById('asset-list');
            list.innerHTML = assets.map(asset => {
                const isVideo = asset.name.toLowerCase().match(/\.(mp4|webm|ogg)$/);
                const mediaHtml = isVideo 
                    ? `<video src="/api/assets?name=${asset.name}" muted></video>`
                    : `<img src="/api/assets?name=${asset.name}" loading="lazy">`;
                
                return `
                    <div class="asset-card">
                        ${mediaHtml}
                        <p>${asset.name}</p>
                        <button class="del-btn" style="font-size:0.5rem; color:#ff4d4d; border:1px solid #ff4d4d; padding:0.3rem 0.6rem;" onclick="deleteAsset('${asset.name}')">Delete</button>
                    </div>
                `;
            }).join('');
        }

        window.deleteAsset = async (name) => {
            if (confirm(`Permanently remove ${name}? This cannot be undone.`)) {
                await fetch(`/api/assets?name=${name}`, { method: 'DELETE' });
                loadAssets();
            }
        };

        // Archive List
        async function loadAdminList() {
            const res = await fetch('/api/portfolio');
            const data = await res.json();
            const list = document.getElementById('admin-list');
            list.innerHTML = data.map(item => {
                let thumbUrl = item.image;
                if (!thumbUrl && item.content) {
                    const div = document.createElement('div');
                    div.innerHTML = item.content;
                    const media = div.querySelector('img, video');
                    if (media) thumbUrl = media.src;
                }
                const isVideo = thumbUrl && thumbUrl.toLowerCase().match(/\.(mp4|webm|ogg)$/);
                const mediaHtml = isVideo 
                    ? `<video src="${thumbUrl}" muted style="width: 60px; height: 60px; object-fit: cover; opacity: 0.6;"></video>`
                    : `<img src="${thumbUrl || ''}" style="width: 60px; height: 60px; object-fit: cover; opacity: 0.6;">`;

                return `
                    <tr>
                        <td>${mediaHtml}</td>
                        <td style="font-weight: 600;">${item.title}</td>
                        <td style="font-size: 0.65rem; font-weight: 900; color: var(--sori-accent); letter-spacing: 0.1em;">${item.category}</td>
                        <td class="admin-actions">
                            <a href="editor.html?id=${item.id}">Edit</a>
                            <button class="del-btn" onclick="deleteItem(${item.id})">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // SNS Management
        async function loadSNSAdmin() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            const list = document.getElementById('sns-admin-list');
            list.innerHTML = data.filter(s => s.type === 'sns').map(item => `
                <tr>
                    <td style="font-weight: 800; font-size: 0.7rem; letter-spacing: 0.1em;">${item.key}</td>
                    <td style="opacity: 0.5; font-size: 0.8rem;">${item.value}</td>
                    <td class="admin-actions"><button class="del-btn" onclick="deleteSNS(${item.id})">Remove</button></td>
                </tr>
            `).join('');
        }

        const snsForm = document.getElementById('sns-form');
        snsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    key: document.getElementById('sns-key').value,
                    value: document.getElementById('sns-value').value,
                    type: 'sns'
                })
            });
            snsForm.reset();
            loadSNSAdmin();
        });

        window.deleteSNS = async (id) => {
            if (confirm('Remove this channel?')) {
                await fetch(`/api/settings?id=${id}`, { method: 'DELETE' });
                loadSNSAdmin();
            }
        };

        window.deleteItem = async (id) => {
            if (confirm('Permanently delete this fragments?')) {
                await fetch(`/api/portfolio?id=${id}`, { method: 'DELETE' });
                loadAdminList();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadHeroSettings();
            loadAssets();
            loadAdminList();
            loadSNSAdmin();
        });
    </script>
</body>
</html>
