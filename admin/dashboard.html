<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorigrim | Admin Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .admin-main { padding: 8rem 4rem; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 4rem; }
        .admin-table th, .admin-table td { padding: 1.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .admin-table th { font-size: 0.7rem; text-transform: uppercase; color: var(--sori-muted); letter-spacing: 0.2em; }
        .admin-table td { font-size: 0.9rem; }
        .admin-actions { display: flex; gap: 1.5rem; }
        .admin-actions a, .admin-actions button { background: none; border: none; color: var(--sori-muted); cursor: pointer; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }
        .admin-actions a:hover { color: var(--sori-fg); }
        .admin-actions .del-btn:hover { color: #ff4d4d; }
    </style>
</head>
<body class="bg-surface">
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="nav-links">
            <a href="/admin/dashboard.html">CMS</a>
            <a href="/admin/editor.html" class="btn-premium" style="padding: 0.6rem 1.5rem; font-size: 0.6rem;">New Post</a>
        </div>
    </nav>

    <main class="admin-main container">
        <header class="section-header">
            <h1>Archive Control.</h1>
        </header>

        <table class="admin-table">
            <thead>
                <tr><th>Thumbnail</th><th>Title</th><th>Category</th><th>Actions</th></tr>
            </thead>
            <tbody id="admin-list">
                <!-- Dynamic List -->
            </tbody>
        </table>
        </section>

        <!-- 2. SNS Management -->
        <section style="margin-top: 8rem;">
            <header class="section-header">
                <h2>Social Channels.</h2>
            </header>
            <form id="sns-form" style="display: flex; gap: 1.5rem; margin-bottom: 3rem; align-items: flex-end;">
                <div style="flex: 1;"><label style="display:block; font-size:0.6rem; color:var(--sori-muted); margin-bottom:0.5rem;">PLATFORM</label>
                <input type="text" id="sns-key" placeholder="Instagram" style="width:100%; padding:1rem; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.1); color:white;"></div>
                <div style="flex: 2;"><label style="display:block; font-size:0.6rem; color:var(--sori-muted); margin-bottom:0.5rem;">URL</label>
                <input type="url" id="sns-value" placeholder="https://..." style="width:100%; padding:1rem; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.1); color:white;"></div>
                <button type="submit" class="btn-premium" style="padding: 1rem 2rem; font-size: 0.6rem;">Update Channel</button>
            </form>
            <table class="admin-table">
                <tbody id="sns-admin-list"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        async function loadAdminList() {
            const res = await fetch('/api/portfolio');
            const data = await res.json();
            const list = document.getElementById('admin-list');
            list.innerHTML = data.map(item => `
                <tr>
                    <td><img src="${item.image}" style="width: 60px; height: 60px; object-fit: cover; opacity: 0.6;"></td>
                    <td>${item.title}</td>
                    <td style="font-size: 0.7rem; font-weight: 800; color: var(--sori-accent);">${item.category}</td>
                    <td class="admin-actions">
                        <a href="editor.html?id=${item.id}">Edit</a>
                        <button class="del-btn" onclick="deleteItem(${item.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadSNSAdmin() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            const list = document.getElementById('sns-admin-list');
            list.innerHTML = data.map(item => `
                <tr>
                    <td style="font-weight: 800; font-size: 0.7rem; letter-spacing: 0.1em;">${item.key}</td>
                    <td style="opacity: 0.5; font-size: 0.8rem;">${item.value}</td>
                    <td class="admin-actions"><button class="del-btn" onclick="deleteSNS(${item.id})">Remove</button></td>
                </tr>
            `).join('');
        }

        const snsForm = document.getElementById('sns-form');
        snsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    key: document.getElementById('sns-key').value,
                    value: document.getElementById('sns-value').value
                })
            });
            snsForm.reset();
            loadSNSAdmin();
        });

        window.deleteSNS = async (id) => {
            if (confirm('Remove this channel?')) {
                await fetch(`/api/settings?id=${id}`, { method: 'DELETE' });
                loadSNSAdmin();
            }
        }

        window.deleteItem = async (id) => {
            if (confirm('Permanently delete this fragments?')) {
                await fetch(`/api/portfolio?id=${id}`, { method: 'DELETE' });
                loadAdminList();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadAdminList();
            loadSNSAdmin();
        });
    </script>
</body>
</html>
