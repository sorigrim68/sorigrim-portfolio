<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM | SEO & Board Integrated Editor</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .editor-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 8rem 0; align-items: start; }
        .editor-main { background: white; padding: 3rem; border: 1px solid var(--border); border-radius: 8px; }
        .form-group { margin-bottom: 2.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; background: var(--bg-light); border: 1px solid var(--border);
            color: var(--text-main); font-family: inherit; font-size: 1rem; border-radius: 4px;
        }
        .editor-toolbar { display: flex; gap: 0.5rem; padding: 0.8rem; background: var(--bg-light); border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
        .toolbar-group { display: flex; gap: 0.3rem; align-items: center; border-right: 1px solid #ddd; padding-right: 0.8rem; margin-right: 0.5rem; }
        .editor-toolbar button, .editor-toolbar select { background: white; border: 1px solid var(--border); padding: 0.5rem 0.8rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.2s; color: var(--text-main); }
        .editor-toolbar button:hover { background: var(--primary); color: white; }
        .editor-wrapper { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; background: white; }
        .rich-editor { height: 600px; overflow-y: auto; padding: 3rem; outline: none; font-size: 1.1rem; line-height: 1.8; }
        #save-btn { width: 100%; padding: 1.5rem; font-size: 1.1rem; font-weight: 800; margin-top: 2rem; }
        .upload-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; gap: 2rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="upload-overlay" class="upload-overlay"><div class="spinner"></div><div style="font-weight:700; color:var(--primary);">전송 중...</div></div>
    <nav id="global-nav" class="scrolled"><a href="/" class="brand">SORIGRIM</a><a href="dashboard.html" style="font-size:0.85rem; color:var(--text-muted); text-decoration:none;">← 관리 홈으로</a></nav>
    <main class="container">
        <div class="editor-layout">
            <div class="editor-main">
                <form id="editor-form">
                    <div class="form-group"><label>작품 제목</label><input type="text" id="title" required></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
                        <div class="form-group"><label>카테고리</label><select id="category" required></select></div>
                        <div class="form-group"><label>태그 (쉼표로 구분)</label><input type="text" id="tags" placeholder="Cyberpunk, Realistic, Portrait"></div>
                    </div>
                    <div class="form-group"><label>AI Prompt</label><textarea id="prompt" rows="4"></textarea></div>
                    <div class="form-group"><label>본문 내용</label>
                        <div class="editor-wrapper">
                            <div class="editor-toolbar">
                                <div class="toolbar-group"><select onchange="execCmd('fontName', this.value)"><option value="Pretendard Variable">기본 글꼴</option><option value="serif">명조체</option></select><select onchange="execCmd('fontSize', this.value)"><option value="3">보통</option><option value="5">크게</option></select></div>
                                <div class="toolbar-group"><button type="button" onclick="execCmd('bold')">B</button><button type="button" onclick="execCmd('italic')">I</button></div>
                                <div class="toolbar-group"><button type="button" onclick="handleMediaUpload('image')">이미지</button><button type="button" onclick="handleMediaUpload('video')">영상</button></div>
                            </div>
                            <div id="content-editor" class="rich-editor" contenteditable="true"></div>
                        </div>
                    </div>
                    <div class="form-group" style="background:var(--bg-light); padding:1.5rem; border-radius:4px; display:flex; flex-direction:column; gap:1rem;">
                        <label style="display:flex; align-items:center; gap:1rem;"><input type="checkbox" id="is_published" checked> 🌐 웹사이트에 즉시 게시</label>
                        <label style="display:flex; align-items:center; gap:1rem;"><input type="checkbox" id="is_hero"> ★ 메인 히어로 사용</label>
                        <label style="display:flex; align-items:center; gap:1rem;"><input type="checkbox" id="is_recommended"> ✔ 추천 작품 등록</label>
                    </div>
                    <button type="submit" id="save-btn" class="btn-premium">작품 저장하기</button>
                </form>
            </div>
        </div>
    </main>
    <input type="file" id="editor-media-upload" style="display:none;" multiple>
    <script type="module">
        const form = document.getElementById('editor-form'); const editor = document.getElementById('content-editor'); const mediaInput = document.getElementById('editor-media-upload');
        const urlParams = new URLSearchParams(window.location.search); const editId = urlParams.get('id');
        let lastRange = null;
        async function loadCategories() { const res = await fetch('/api/categories'); const cats = await res.json(); document.getElementById('category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); if (editId) loadPostData(); }
        async function loadPostData() {
            const res = await fetch(`/api/portfolio?id=${editId}&admin=true`); const d = await res.json();
            document.getElementById('title').value = d.title; document.getElementById('category').value = d.category;
            document.getElementById('tags').value = d.tags || ''; document.getElementById('prompt').value = d.prompt || '';
            editor.innerHTML = d.content || ''; document.getElementById('is_published').checked = d.is_published === 1;
            document.getElementById('is_hero').checked = d.is_hero === 1; document.getElementById('is_recommended').checked = d.is_recommended === 1;
        }
        window.execCmd = (c, v = null) => { document.execCommand(c, false, v); editor.focus(); };
        window.handleMediaUpload = (t) => { mediaInput.accept = t === 'image' ? 'image/*' : 'video/*'; mediaInput.onchange = async () => {
            const files = Array.from(mediaInput.files); if (files.length > 0) { document.getElementById('upload-overlay').style.display='flex';
            for (const f of files) { const url = await uploadFile(f); if (url) insertMedia(t, url); }
            document.getElementById('upload-overlay').style.display='none'; mediaInput.value=''; }
        }; mediaInput.click(); };
        function insertMedia(t, url) { editor.focus(); const n = t === 'image' ? document.createElement('img') : document.createElement('video'); n.src = url; n.style.maxWidth = "100%"; n.style.display = "block"; n.style.margin = "2rem 0"; if (t === 'video') { n.controls = true; n.playsInline = true; } editor.appendChild(n); editor.appendChild(document.createElement('p')).innerHTML = '<br>'; }
        async function uploadFile(f) { const fd = new FormData(); fd.append('file', f); try { const res = await fetch('/api/assets', { method: 'POST', body: fd }); const d = await res.json(); return d.url; } catch (e) { return null; } }
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); const div = document.createElement('div'); div.innerHTML = editor.innerHTML; const first = div.querySelector('img, video');
            const data = { 
                title: document.getElementById('title').value, 
                category: document.getElementById('category').value, 
                tags: document.getElementById('tags').value, 
                prompt: document.getElementById('prompt').value, 
                content: editor.innerHTML, 
                image: first ? first.src : '', 
                is_published: document.getElementById('is_published').checked, 
                is_hero: document.getElementById('is_hero').checked, 
                is_recommended: document.getElementById('is_recommended').checked 
            };
            const res = await fetch('/api/portfolio' + (editId ? `?id=${editId}` : ''), { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data) 
            });
            if (res.ok) window.location.href = 'dashboard.html';
            else alert('저장 중 오류가 발생했습니다.');
        });
        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
