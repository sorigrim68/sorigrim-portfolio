<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM | SEO & Board Integrated Editor</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .editor-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 8rem 0; align-items: start; }
        .editor-main { background: white; padding: 3rem; border: 1px solid var(--border); border-radius: 8px; }
        .form-group { margin-bottom: 2.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; background: var(--bg-light); border: 1px solid var(--border);
            color: var(--text-main); font-family: inherit; font-size: 1rem; border-radius: 4px;
        }
        
        .editor-sidebar { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .sidebar-card h4 { font-size: 0.9rem; font-weight: 800; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
        
        .seo-check { display: flex; align-items: center; gap: 0.8rem; font-size: 0.85rem; margin-bottom: 0.8rem; color: #555; }
        .seo-check .status { width: 10px; height: 10px; border-radius: 50%; background: #ddd; }
        .seo-check.pass .status { background: #28a745; }
        .seo-check.warn .status { background: #ffc107; }
        .seo-check.fail .status { background: #dc3545; }

        .editor-toolbar {
            display: flex; gap: 0.5rem; padding: 0.8rem; background: var(--bg-light); 
            border: none; border-bottom: 1px solid var(--border); flex-wrap: wrap;
            position: sticky; top: 0; z-index: 10;
        }
        .toolbar-group {
            display: flex; gap: 0.3rem; align-items: center; 
            border-right: 1px solid #ddd; padding-right: 0.8rem; margin-right: 0.5rem;
        }
        .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        
        .editor-toolbar button, .editor-toolbar select {
            background: white; border: 1px solid var(--border); padding: 0.5rem 0.8rem; 
            font-size: 0.8rem; font-weight: 700; cursor: pointer; border-radius: 4px;
            transition: 0.2s; color: var(--text-main);
        }
        .editor-toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .editor-toolbar select { padding-right: 1.5rem; }
        
        .editor-wrapper {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: white;
        }

        .rich-editor {
            height: 700px; overflow-y: auto; padding: 3rem; 
            outline: none; font-size: 1.1rem; line-height: 1.8;
            background: white;
        }
        .rich-editor h2 { font-size: 2rem; margin: 2.5rem 0 1.2rem; font-weight: 800; }
        .rich-editor img, .rich-editor video { max-width: 100%; border-radius: 4px; margin: 2rem 0; display: block; height: auto; }

        #save-btn { width: 100%; padding: 1.5rem; font-size: 1.1rem; font-weight: 800; margin-top: 2rem; }
        
        .upload-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; gap: 2rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="upload-overlay" class="upload-overlay">
        <div class="spinner"></div>
        <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">시각적 조각을 전송 중...</div>
    </div>

    <nav id="global-nav" class="scrolled">
        <a href="/" class="brand">SORIGRIM</a>
        <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← 관리 홈으로</a>
    </nav>

    <main class="container">
        <div class="editor-layout">
            <div class="editor-main">
                <form id="editor-form">
                    <div class="form-group">
                        <label>작품 제목</label>
                        <input type="text" id="title" placeholder="작품의 이름을 입력하세요..." required>
                    </div>

                    <div class="form-group">
                        <label>카테고리 (게시판)</label>
                        <select id="category" required>
                            <!-- 동적으로 로드됨 -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label>본문 내용</label>
                        <div class="editor-wrapper">
                            <div class="editor-toolbar">
                                <div class="toolbar-group">
                                    <select onchange="execCmd('fontName', this.value)" title="글꼴">
                                        <option value="Pretendard Variable">기본 글꼴</option>
                                        <option value="'Times New Roman', serif">명조체</option>
                                        <option value="'Courier New', monospace">코드체</option>
                                    </select>
                                    <select onchange="execCmd('fontSize', this.value)" title="글자 크기">
                                        <option value="3">보통</option>
                                        <option value="1">매우 작게</option>
                                        <option value="2">작게</option>
                                        <option value="4">크게</option>
                                        <option value="5">더 크게</option>
                                        <option value="6">매우 크게</option>
                                        <option value="7">최대</option>
                                    </select>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="execCmd('bold')" title="굵게"><b>B</b></button>
                                    <button type="button" onclick="execCmd('italic')" title="기울임"><i>I</i></button>
                                    <button type="button" onclick="execCmd('underline')" title="밑줄"><u>U</u></button>
                                    <button type="button" onclick="execCmd('strikeThrough')" title="취소선"><s>S</s></button>
                                </div>
                                <div class="toolbar-group">
                                    <input type="color" onchange="execCmd('foreColor', this.value)" title="글자 색상" style="width:30px; height:30px; padding:0; border:none; background:none; cursor:pointer;">
                                    <button type="button" onclick="execCmd('justifyLeft')" title="좌측 정렬">左</button>
                                    <button type="button" onclick="execCmd('justifyCenter')" title="중앙 정렬">中</button>
                                    <button type="button" onclick="execCmd('justifyRight')" title="우측 정렬">右</button>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="execCmd('formatBlock', 'H2')" title="소제목">제목</button>
                                    <button type="button" onclick="execCmd('formatBlock', 'P')" title="일반문단">본문</button>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="handleMediaUpload('image')" style="color: var(--primary);" title="이미지 삽입">이미지</button>
                                    <button type="button" onclick="handleMediaUpload('video')" style="color: var(--primary);" title="영상 삽입">영상</button>
                                    <button type="button" onclick="execCmd('createLink')" title="링크 삽입">🔗</button>
                                    <button type="button" onclick="execCmd('removeFormat')" title="서식 지우기">Clear</button>
                                </div>
                            </div>
                            <div id="content-editor" class="rich-editor" contenteditable="true" spellcheck="false"></div>
                        </div>
                    </div>

                    <div class="form-group" style="background: var(--bg-light); padding: 1.5rem; border-radius: 4px;">
                        <div style="display:flex; align-items:center; gap:1rem;">
                            <input type="checkbox" id="is_hero" style="width: auto;">
                            <label style="margin-bottom:0; color: var(--primary); font-weight:700;">★ 이 게시글의 썸네일을 메인 히어로 이미지로 사용</label>
                        </div>
                    </div>

                    <button type="submit" id="save-btn" class="btn-premium">작품 저장하기</button>
                </form>
            </div>

            <div class="editor-sidebar">
                <div class="sidebar-card">
                    <h4>콘텐츠 진단</h4>
                    <div id="seo-score-list">
                        <div id="check-media" class="seo-check"><div class="status"></div> 썸네일 자동 추출 대기</div>
                        <div id="check-length" class="seo-check"><div class="status"></div> 본문 글자 수</div>
                        <div id="check-h2" class="seo-check"><div class="status"></div> 소제목 활용</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="editor-media-upload" style="display: none;" multiple>

    <script type="module">
        const form = document.getElementById('editor-form');
        const saveBtn = document.getElementById('save-btn');
        const editor = document.getElementById('content-editor');
        const overlay = document.getElementById('upload-overlay');
        const uploadText = overlay.querySelector('div:last-child');
        const mediaInput = document.getElementById('editor-media-upload');
        const categorySelect = document.getElementById('category');
        
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');

        let lastSelection = null;

        // --- 1. Category Loading ---
        async function loadCategories() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            categorySelect.innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            
            if (editId) loadPostData();
        }

        // --- 2. Selection Management ---
        function saveSelection() {
            const sel = window.getSelection();
            if (sel.getRangeAt && sel.rangeCount) {
                lastSelection = sel.getRangeAt(0);
            }
        }

        function restoreSelection() {
            if (lastSelection) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(lastSelection);
            }
        }

        editor.addEventListener('blur', saveSelection);
        editor.addEventListener('keyup', saveSelection);
        editor.addEventListener('click', saveSelection);

        // --- 3. Media Upload & Insertion (Multi-support) ---
        window.handleMediaUpload = (type) => {
            saveSelection();
            mediaInput.accept = type === 'image' ? 'image/*' : 'video/*';
            mediaInput.onchange = async () => {
                const files = Array.from(mediaInput.files);
                if (files.length > 0) {
                    overlay.style.display = 'flex';
                    
                    for (let i = 0; i < files.length; i++) {
                        uploadText.innerText = `시각적 조각 전송 중... (${i + 1}/${files.length})`;
                        const url = await uploadFile(files[i]);
                        if (url) {
                            insertAtCursor(type, url);
                        }
                    }
                    
                    overlay.style.display = 'none';
                    mediaInput.value = ''; // Reset input
                }
            };
            mediaInput.click();
        };

        function insertAtCursor(type, url) {
            editor.focus();
            restoreSelection();

            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            range.deleteContents();

            let node;
            if (type === 'image') {
                node = document.createElement('img');
                node.src = url;
                node.alt = "AI ART SORIGRIM";
                node.style.maxWidth = "100%";
                node.style.display = "block";
                node.style.margin = "2rem 0";
            } else {
                node = document.createElement('video');
                node.src = url;
                node.controls = true;
                node.playsInline = true;
                node.style.maxWidth = "100%";
                node.style.display = "block";
                node.style.margin = "2rem 0";
            }

            // 노드 삽입 및 커서 이동
            range.insertNode(node);
            
            const nextNode = document.createElement('p');
            nextNode.innerHTML = '<br>';
            node.after(nextNode);

            range.setStartAfter(nextNode);
            range.setEndAfter(nextNode);
            sel.removeAllRanges();
            sel.addRange(range);

            saveSelection(); // 다음 삽입을 위해 현재 위치 저장
            updateSEO();
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/assets', { method: 'POST', body: formData });
                const data = await res.json();
                return data.url;
            } catch (e) { return null; }
        }

        // --- 4. SEO & UI ---
        function updateSEO() {
            const text = editor.innerText;
            const html = editor.innerHTML;
            const hasMedia = html.includes('<img') || html.includes('<video');
            toggleCheck('check-media', hasMedia ? 'pass' : 'fail');
            toggleCheck('check-length', text.trim().length > 100 ? 'pass' : 'warn');
            toggleCheck('check-h2', html.includes('<h2') ? 'pass' : 'fail');
        }

        function toggleCheck(id, status) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('pass', 'warn', 'fail');
            el.classList.add(status);
        }

        editor.addEventListener('input', updateSEO);

        window.execCmd = (cmd, val = null) => {
            document.execCommand(cmd, false, val);
            editor.focus();
            updateSEO();
        };

        // --- 5. Save & Load ---
        async function loadPostData() {
            const res = await fetch(`/api/portfolio?id=${editId}`);
            const data = await res.json();
            document.getElementById('title').value = data.title;
            categorySelect.value = data.category; // 카테고리 로드 후 설정됨
            editor.innerHTML = data.content || '';
            if (document.getElementById('is_hero')) {
                document.getElementById('is_hero').checked = data.is_hero === 1;
            }
            updateSEO();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            saveBtn.disabled = true;
            saveBtn.innerText = '저장 중...';

            const div = document.createElement('div');
            div.innerHTML = editor.innerHTML;
            const firstMedia = div.querySelector('img, video');
            const thumb = firstMedia ? firstMedia.src : "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop";

            const data = {
                title: document.getElementById('title').value,
                category: categorySelect.value,
                image: thumb,
                description: editor.innerText.slice(0, 200),
                content: editor.innerHTML,
                is_recommended: 0,
                is_hero: document.getElementById('is_hero').checked
            };
            
            try {
                const res = await fetch('/api/portfolio' + (editId ? `?id=${editId}` : ''), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('성공적으로 저장되었습니다.');
                    window.location.href = 'dashboard.html';
                } else {
                    saveBtn.disabled = false;
                    saveBtn.innerText = '작품 저장하기';
                }
            } catch (err) {
                saveBtn.disabled = false;
                saveBtn.innerText = '작품 저장하기';
            }
        });

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
