<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM | Full-Featured Pro Editor</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .editor-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 8rem 0; align-items: start; }
        .editor-main { background: white; padding: 3rem; border: 1px solid var(--border); border-radius: 8px; }
        .form-group { margin-bottom: 2.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; background: var(--bg-light); border: 1px solid var(--border);
            color: var(--text-main); font-family: inherit; font-size: 1rem; border-radius: 4px;
        }
        
        /* 툴바 스타일 완벽 복구 */
        .editor-toolbar {
            display: flex; gap: 0.5rem; padding: 0.8rem; background: var(--bg-light); 
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
            position: sticky; top: 0; z-index: 10;
        }
        .toolbar-group {
            display: flex; gap: 0.3rem; align-items: center; 
            border-right: 1px solid #ddd; padding-right: 0.8rem; margin-right: 0.5rem;
        }
        .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        
        .editor-toolbar button, .editor-toolbar select {
            background: white; border: 1px solid var(--border); padding: 0.5rem 0.8rem; 
            font-size: 0.8rem; font-weight: 700; cursor: pointer; border-radius: 4px;
            transition: 0.2s; color: var(--text-main);
        }
        .editor-toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .editor-wrapper {
            border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white;
        }

        .rich-editor { height: 700px; overflow-y: auto; padding: 3rem; outline: none; font-size: 1.1rem; line-height: 1.8; background: white; }

        /* 사이드바 SEO 복구 */
        .editor-sidebar { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .sidebar-card h4 { font-size: 0.9rem; font-weight: 800; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
        .seo-check { display: flex; align-items: center; gap: 0.8rem; font-size: 0.85rem; margin-bottom: 0.8rem; color: #555; }
        .seo-check .status { width: 10px; height: 10px; border-radius: 50%; background: #ddd; }
        .seo-check.pass .status { background: #28a745; }
        .seo-check.warn .status { background: #ffc107; }
        .seo-check.fail .status { background: #dc3545; }

        /* 하단 옵션 정렬 완벽 복구 */
        .bottom-options { background: var(--bg-light); padding: 2rem; border-radius: 8px; margin-top: 2rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .option-item { display: flex; align-items: center; gap: 1rem; cursor: pointer; user-select: none; }
        .option-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; margin: 0; }
        .option-item span { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

        #save-btn { width: 100%; padding: 1.5rem; font-size: 1.1rem; font-weight: 800; margin-top: 2rem; }
        
        /* 모달 스타일 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: white; padding: 3rem; border-radius: 12px; width: 90%; max-width: 600px; }
        .template-item { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; cursor: pointer; transition: 0.3s; }
        .template-item:hover { border-color: var(--primary); background: var(--bg-light); }

        .upload-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; gap: 2rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1200px) { .editor-layout { grid-template-columns: 1fr; } .editor-sidebar { position: static; order: 2; } }
    </style>
</head>
<body>
    <div id="upload-overlay" class="upload-overlay"><div class="spinner"></div><div id="upload-msg" style="font-weight:700; color:var(--primary);">처리 중...</div></div>
    
    <div id="template-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:2rem;">프롬프트 템플릿</h3>
            <div id="template-list">
                <div class="template-item" onclick="applyTemplate('cinematic')"><strong>🎬 Cinematic Photo</strong><br><small>high quality, 8k, cinematic lighting...</small></div>
                <div class="template-item" onclick="applyTemplate('negative')"><strong>🚫 Standard Negative</strong><br><small>blur, low quality, distorted...</small></div>
            </div>
            <button class="btn-premium" style="width:100%; margin-top:1rem;" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <nav id="global-nav" class="scrolled">
        <a href="/" class="brand">SORIGRIM</a>
        <div id="autosave-status" style="font-size:0.75rem; color:var(--primary); font-weight:800;"></div>
        <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← 관리 홈으로</a>
    </nav>

    <main class="container">
        <div class="editor-layout">
            <div class="editor-main">
                <form id="editor-form">
                    <div class="form-group"><label>작품 제목</label><input type="text" id="title" required placeholder="제목을 입력하세요"></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
                        <div class="form-group"><label>카테고리</label><select id="category" required></select></div>
                        <div class="form-group"><label>태그 (쉼표 구분)</label><input type="text" id="tags" placeholder="Cyberpunk, Realistic"></div>
                    </div>
                    <div class="form-group">
                        <div style="display:flex; justify-content:space-between;"><label>AI Prompt</label><button type="button" onclick="openTemplates()" style="font-size:0.7rem; font-weight:800; color:var(--primary); border:none; background:none; cursor:pointer;">+ 템플릿 불러오기</button></div>
                        <textarea id="prompt" rows="4" placeholder="사용된 프롬프트..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>본문 내용</label>
                        <div class="editor-wrapper">
                            <div class="editor-toolbar">
                                <div class="toolbar-group">
                                    <select onchange="execCmd('fontName', this.value)" style="width:120px;">
                                        <option value="Pretendard Variable">Pretendard</option>
                                        <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">System Sans</option>
                                        <option value="'Times New Roman', Times, serif">System Serif</option>
                                        <option value="'Courier New', Courier, monospace">Monospace</option>
                                        <option value='Georgia, serif'>Georgia</option>
                                        <option value='Verdana, sans-serif'>Verdana</option>
                                    </select>
                                    <select onchange="execCmd('fontSize', this.value)">
                                        <option value="3">Normal</option>
                                        <option value="1">Small</option>
                                        <option value="5">Large</option>
                                        <option value="7">Huge</option>
                                    </select>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" title="Bold" onclick="execCmd('bold')"><b>B</b></button>
                                    <button type="button" title="Italic" onclick="execCmd('italic')"><i>I</i></button>
                                    <button type="button" title="Underline" onclick="execCmd('underline')"><u>U</u></button>
                                    <button type="button" title="Strikethrough" onclick="execCmd('strikeThrough')"><s>S</s></button>
                                    <input type="color" title="Text Color" onchange="execCmd('foreColor', this.value)" style="width:25px; height:25px; border:none; padding:0; background:none; cursor:pointer;">
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" title="Align Left" onclick="execCmd('justifyLeft')">Left</button>
                                    <button type="button" title="Align Center" onclick="execCmd('justifyCenter')">Center</button>
                                    <button type="button" title="Align Right" onclick="execCmd('justifyRight')">Right</button>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" title="Heading 2" onclick="execCmd('formatBlock', 'H2')">H2</button>
                                    <button type="button" title="Heading 3" onclick="execCmd('formatBlock', 'H3')">H3</button>
                                    <button type="button" title="Quote" onclick="execCmd('formatBlock', 'BLOCKQUOTE')" style="font-style:italic;">Quote</button>
                                    <button type="button" title="Bullet List" onclick="execCmd('insertUnorderedList')">• List</button>
                                    <button type="button" title="Numbered List" onclick="execCmd('insertOrderedList')">1. List</button>
                                    <button type="button" title="Horizontal Rule" onclick="execCmd('insertHorizontalRule')">— HR</button>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="insertColumns()" style="color:var(--primary); font-weight:800;">2-Columns</button>
                                    <button type="button" onclick="handleMediaUpload('image')">Image</button>
                                    <button type="button" onclick="handleMediaUpload('video')">Video</button>
                                    <button type="button" onclick="promptLink()">🔗</button>
                                    <button type="button" onclick="execCmd('removeFormat')" style="color:#d9534f;">Clear</button>
                                </div>
                                <div class="toolbar-group">
                                    <span style="font-size:0.65rem; font-weight:800; color:#AAA; margin-right:5px;">MEDIA SIZE:</span>
                                    <button type="button" onclick="resizeSelectedMedia('25%')">25%</button>
                                    <button type="button" onclick="resizeSelectedMedia('50%')">50%</button>
                                    <button type="button" onclick="resizeSelectedMedia('100%')">100%</button>
                                </div>
                            </div>
                            <div id="content-editor" class="rich-editor" contenteditable="true" spellcheck="false"></div>
                        </div>
                    </div>

                    <div class="bottom-options">
                        <label class="option-item"><input type="checkbox" id="is_published" checked><span>🌐 웹사이트에 즉시 게시 (체크 해제 시 임시저장)</span></label>
                        <label class="option-item"><input type="checkbox" id="is_hero"><span>★ 이 게시글의 썸네일을 메인 히어로 이미지로 사용</span></label>
                        <label class="option-item"><input type="checkbox" id="is_recommended"><span>✔ 이 게시글을 메인 페이지 추천 작품으로 등록</span></label>
                    </div>
                    <button type="submit" id="save-btn" class="btn-premium">작품 저장하기</button>
                </form>
            </div>

            <div class="editor-sidebar">
                <div class="sidebar-card">
                    <h4>콘텐츠 진단 (SEO)</h4>
                    <div id="seo-score-list">
                        <div id="check-media" class="seo-check"><div class="status"></div> 미디어 포함</div>
                        <div id="check-length" class="seo-check"><div class="status"></div> 글자 수</div>
                        <div id="check-prompt" class="seo-check"><div class="status"></div> 프롬프트 작성</div>
                    </div>
                </div>
                <div class="sidebar-card">
                    <h4>편집 도움말</h4>
                    <p style="font-size:0.75rem; color:#666; line-height:1.6;">- 이미지를 넣으면 하단에 캡션란이 생깁니다.<br>- 2단 레이아웃으로 잡지 같은 구성을 해보세요.<br>- 본문에 주소만 적어도 자동 링크가 됩니다.</p>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="editor-media-upload" style="display:none;" multiple>

    <script type="module">
        const form = document.getElementById('editor-form'); const editor = document.getElementById('content-editor'); const mediaInput = document.getElementById('editor-media-upload');
        const urlParams = new URLSearchParams(window.location.search); const editId = urlParams.get('id');

        // --- 1. 초기 데이터 로드 ---
        async function loadCategories() { 
            const res = await fetch('/api/categories'); const cats = await res.json(); 
            document.getElementById('category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); 
            if (editId) loadPostData(); 
        }

        async function loadPostData() {
            const res = await fetch(`/api/portfolio?id=${editId}&admin=true`); const d = await res.json();
            document.getElementById('title').value = d.title; document.getElementById('category').value = d.category;
            document.getElementById('tags').value = d.tags || ''; document.getElementById('prompt').value = d.prompt || '';
            editor.innerHTML = d.content || ''; 
            document.getElementById('is_published').checked = d.is_published === 1;
            document.getElementById('is_hero').checked = d.is_hero === 1; 
            document.getElementById('is_recommended').checked = d.is_recommended === 1;
            updateSEO();
        }

        window.execCmd = (c, v = null) => { document.execCommand(c, false, v); editor.focus(); updateSEO(); };

        // --- 2. 다단 레이아웃 ---
        window.insertColumns = () => {
            const row = document.createElement('div'); row.className = 'sg-row';
            row.innerHTML = '<div class="sg-col" contenteditable="true"></div><div class="sg-col" contenteditable="true"></div>';
            editor.appendChild(row); editor.appendChild(document.createElement('p')).innerHTML = '<br>';
        };

        // --- 3. 미디어 및 조절 ---
        let lastSelectedMedia = null;

        window.handleMediaUpload = (t) => {
            mediaInput.accept = t === 'image' ? 'image/*' : 'video/*';
            mediaInput.onchange = async () => {
                const files = Array.from(mediaInput.files);
                if (files.length > 0) {
                    for (const f of files) {
                        const url = await uploadFile(f);
                        if (url) insertMedia(t, url);
                    }
                    mediaInput.value='';
                }
            };
            mediaInput.click();
        };

        async function uploadFile(f) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const overlay = document.getElementById('upload-overlay');
                const msg = document.getElementById('upload-msg');
                
                overlay.style.display = 'flex';
                msg.innerText = `업로드 중: 0% (${(f.size / (1024*1024)).toFixed(1)}MB)`;

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        msg.innerText = `업로드 중: ${percent}% (${(f.size / (1024*1024)).toFixed(1)}MB)`;
                    }
                };

                xhr.onload = () => {
                    overlay.style.display = 'none';
                    if (xhr.status === 200) {
                        try {
                            const d = JSON.parse(xhr.responseText);
                            if (d.success) resolve(d.url);
                            else throw new Error(d.error || 'Unknown error');
                        } catch (e) { reject(e); }
                    } else if (xhr.status === 413) {
                        reject(new Error("파일 용량이 너무 큽니다 (Cloudflare 100MB 제한)"));
                    } else {
                        reject(new Error(`서버 오류 (${xhr.status})`));
                    }
                };

                xhr.onerror = () => { overlay.style.display = 'none'; reject(new Error("네트워크 오류")); };
                
                xhr.open('POST', `/api/assets?name=${encodeURIComponent(f.name)}`);
                xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
                xhr.send(f);
            }).catch(e => {
                alert(`업로드 실패: ${e.message}`);
                return null;
            });
        }

        function insertMedia(t, url) {
            const selection = window.getSelection();
            let range;
            if (selection.rangeCount > 0) {
                range = selection.getRangeAt(0);
                // Ensure we are inside the editor
                if (!editor.contains(range.commonAncestorContainer)) {
                    range = document.createRange();
                    range.selectNodeContents(editor);
                    range.collapse(false);
                }
            } else {
                range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
            }

            const wrapper = document.createElement('div'); 
            wrapper.className = 'sg-image-wrapper';
            wrapper.style.width = "100%";
            wrapper.style.margin = "2.5rem auto";
            wrapper.style.transition = "width 0.4s ease";
            wrapper.contentEditable = "false";
            
            const media = t === 'image' ? document.createElement('img') : document.createElement('video');
            media.src = url; 
            media.style.width = "100%";
            media.style.display = "block";
            media.style.cursor = "pointer";
            media.style.borderRadius = "8px";
            if (t === 'video') media.controls = true;

            media.onclick = (e) => {
                e.stopPropagation();
                if (lastSelectedMedia) lastSelectedMedia.style.outline = "none";
                lastSelectedMedia = wrapper;
                wrapper.style.outline = "3px solid var(--primary)";
                wrapper.style.outlineOffset = "5px";
            };

            wrapper.appendChild(media);
            
            const delBtn = document.createElement('button');
            delBtn.innerText = "×";
            delBtn.style.cssText = "position:absolute; top:-15px; right:-15px; width:30px; height:30px; background:#d9534f; color:white; border:none; border-radius:50%; cursor:pointer; font-size:20px; font-weight:bold; display:none; z-index:100;";
            
            delBtn.onclick = async (e) => {
                e.stopPropagation();
                if (confirm('이 파일을 서버에서도 영구 삭제하시겠습니까?')) {
                    const fileName = url.split('name=')[1];
                    if (fileName) {
                        try {
                            await fetch(`/api/assets?name=${fileName}`, { method: 'DELETE' });
                            wrapper.remove();
                        } catch (err) { alert('파일 삭제 중 오류가 발생했습니다.'); }
                    } else { wrapper.remove(); }
                }
            };
            
            wrapper.style.position = "relative";
            wrapper.appendChild(delBtn);

            wrapper.onmouseenter = () => delBtn.style.display = "block";
            wrapper.onmouseleave = () => { if(lastSelectedMedia !== wrapper) delBtn.style.display = "none"; };

            // --- Insert at Cursor ---
            range.deleteContents();
            range.insertNode(wrapper);
            
            // Add a new line after the image to keep typing easy
            const p = document.createElement('p');
            p.innerHTML = '<br>';
            wrapper.after(p);
            
            // Move cursor after the new line
            const newRange = document.createRange();
            newRange.setStartAfter(p);
            newRange.collapse(true);
            selection.removeAllRanges();
            selection.addRange(newRange);
            
            updateSEO();
        }

        window.resizeSelectedMedia = (width) => {
            if (lastSelectedMedia) {
                lastSelectedMedia.style.width = width;
                lastSelectedMedia.style.margin = "2.5rem auto";
            } else {
                alert("조절할 이미지를 먼저 클릭해 주세요.");
            }
        };

        // Click outside to deselect
        document.addEventListener('click', () => {
            if (lastSelectedMedia) {
                lastSelectedMedia.style.outline = "none";
                // Don't hide delBtn here to allow clicking it, handled by mouseleave
            }
            lastSelectedMedia = null;
        });

        // --- 4. 링크 및 SEO ---
        window.promptLink = () => {
            const url = prompt("URL:", "https://");
            if (url && url !== "https://") {
                document.execCommand("createLink", false, url);
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const el = selection.getRangeAt(0).commonAncestorContainer.parentElement;
                    if (el.tagName === 'A') { el.target = "_blank"; el.rel = "noopener noreferrer"; }
                }
            }
        };

        function updateSEO() {
            const text = editor.innerText.trim(); const html = editor.innerHTML;
            toggleCheck('check-media', html.includes('<img') || html.includes('<video') ? 'pass' : 'fail');
            toggleCheck('check-length', text.length > 50 ? 'pass' : 'warn');
            toggleCheck('check-prompt', document.getElementById('prompt').value.trim().length > 0 ? 'pass' : 'fail');
        }

        // --- Automatic Linkification ---
        // --- Automatic Linkification (Refined for Precision) ---
        function finalLinkify(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            
            const walk = (node) => {
                // Skip if parent is <a> or if it's not a text node
                if (node.nodeType === 3) {
                    const parent = node.parentNode;
                    if (parent && parent.tagName === 'A') return;
                    if (parent && (parent.tagName === 'IMG' || parent.tagName === 'VIDEO')) return;

                    const text = node.textContent;
                    // Precise URL Regex: starts with http, ends at space or tag end
                    const urlRegex = /(https?:\/\/[^\s<"']+)/g;
                    
                    if (urlRegex.test(text)) {
                        const newHtml = text.replace(urlRegex, (url) => {
                            // Secondary check: avoid punctuation at the end of URL
                            const cleanUrl = url.replace(/[.,;!]+$/, '');
                            const trailing = url.substring(cleanUrl.length);
                            return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${trailing}`;
                        });
                        
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = newHtml;
                        const fragment = document.createDocumentFragment();
                        while (tempDiv.firstChild) fragment.appendChild(tempDiv.firstChild);
                        node.parentNode.replaceChild(fragment, node);
                    }
                } else if (node.nodeType === 1) {
                    // Don't walk inside <a> tags to avoid nested links
                    if (node.tagName !== 'A') {
                        for (let i = node.childNodes.length - 1; i >= 0; i--) {
                            walk(node.childNodes[i]);
                        }
                    }
                }
            };
            walk(div);
            return div.innerHTML;
        }

        function toggleCheck(id, s) { const el = document.getElementById(id); if (el) { el.classList.remove('pass', 'warn', 'fail'); el.classList.add(s); } }
        editor.addEventListener('input', updateSEO);
        document.getElementById('prompt').addEventListener('input', updateSEO);

        // --- 5. 템플릿 및 자동저장 ---
        window.openTemplates = () => document.getElementById('template-modal').style.display = 'flex';
        window.closeModal = () => document.getElementById('template-modal').style.display = 'none';
        window.applyTemplate = (t) => {
            const p = document.getElementById('prompt');
            if (t === 'cinematic') p.value += "high quality, 8k, cinematic lighting, shallow depth of field, masterpiece";
            if (t === 'negative') p.value += " (negative): blur, distorted, low quality, text, watermark, grainy";
            closeModal(); updateSEO();
        };

        setInterval(() => {
            const d = { title: document.getElementById('title').value, content: editor.innerHTML };
            localStorage.setItem('sg-autosave', JSON.stringify(d));
            document.getElementById('autosave-status').innerText = '자동 저장됨 (' + new Date().toLocaleTimeString() + ')';
            setTimeout(() => document.getElementById('autosave-status').innerText = '', 3000);
        }, 30000);

        // --- 6. 저장 제출 ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Apply Auto-Link before saving
            const contentRaw = editor.innerHTML || "";
            const processedContent = finalLinkify(contentRaw);
            
            const div = document.createElement('div'); 
            div.innerHTML = processedContent;
            const first = div.querySelector('img, video');
            
            // Ensure no 'undefined' values are sent to D1
            const data = { 
                title: document.getElementById('title').value || "Untitled", 
                category: document.getElementById('category').value || "General", 
                tags: document.getElementById('tags').value || "", 
                prompt: document.getElementById('prompt').value || "", 
                description: editor.innerText.substring(0, 160).trim() || "", // New field for D1
                content: processedContent || "", 
                image: (first ? first.src : "") || "", 
                is_published: document.getElementById('is_published').checked ? 1 : 0, 
                is_hero: document.getElementById('is_hero').checked ? 1 : 0, 
                is_recommended: document.getElementById('is_recommended').checked ? 1 : 0 
            };
            
            try {
                const res = await fetch('/api/portfolio' + (editId ? `?id=${editId}` : ''), { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(data) 
                });
                if (res.ok) { 
                    localStorage.removeItem('sg-autosave'); 
                    window.location.href = 'dashboard.html'; 
                } else {
                    const err = await res.json();
                    alert('저장 오류: ' + (err.error || '상태 코드 ' + res.status));
                }
            } catch (err) {
                alert('네트워크 오류: ' + err.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
