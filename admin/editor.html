<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM | SEO & Board Integrated Editor</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .editor-layout { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 8rem 0; align-items: start; }
        .editor-main { background: white; padding: 3rem; border: 1px solid var(--border); border-radius: 8px; }
        .form-group { margin-bottom: 2.5rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.8rem; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; background: var(--bg-light); border: 1px solid var(--border);
            color: var(--text-main); font-family: inherit; font-size: 1rem; border-radius: 4px;
        }
        
        .editor-toolbar {
            display: flex; gap: 0.5rem; padding: 0.8rem; background: var(--bg-light); 
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
            position: sticky; top: 0; z-index: 10;
        }
        .toolbar-group {
            display: flex; gap: 0.3rem; align-items: center; 
            border-right: 1px solid #ddd; padding-right: 0.8rem; margin-right: 0.5rem;
        }
        .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
        
        .editor-toolbar button, .editor-toolbar select {
            background: white; border: 1px solid var(--border); padding: 0.5rem 0.8rem; 
            font-size: 0.8rem; font-weight: 700; cursor: pointer; border-radius: 4px;
            transition: 0.2s; color: var(--text-main);
        }
        .editor-toolbar button:hover { background: var(--primary); color: white; border-color: var(--primary); }
        
        .editor-wrapper {
            border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white;
        }

        .rich-editor { height: 600px; overflow-y: auto; padding: 3rem; outline: none; font-size: 1.1rem; line-height: 1.8; background: white; }
        .rich-editor img, .rich-editor video { max-width: 100%; border-radius: 4px; margin: 2rem 0; display: block; height: auto; }

        /* Sidebar SEO Diagnostics */
        .editor-sidebar { position: sticky; top: 120px; display: flex; flex-direction: column; gap: 1.5rem; }
        .sidebar-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .sidebar-card h4 { font-size: 0.9rem; font-weight: 800; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
        .seo-check { display: flex; align-items: center; gap: 0.8rem; font-size: 0.85rem; margin-bottom: 0.8rem; color: #555; }
        .seo-check .status { width: 10px; height: 10px; border-radius: 50%; background: #ddd; }
        .seo-check.pass .status { background: #28a745; }
        .seo-check.warn .status { background: #ffc107; }
        .seo-check.fail .status { background: #dc3545; }

        .bottom-options { background: var(--bg-light); padding: 2rem; border-radius: 8px; margin-top: 2rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .option-item { display: flex; align-items: center; gap: 1rem; cursor: pointer; user-select: none; }
        .option-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; margin: 0; }
        .option-item span { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

        #save-btn { width: 100%; padding: 1.5rem; font-size: 1.1rem; font-weight: 800; margin-top: 2rem; }
        
        .upload-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; gap: 2rem; }
        .spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1200px) {
            .editor-layout { grid-template-columns: 1fr; }
            .editor-sidebar { position: static; order: 2; }
        }
    </style>
</head>
<body>
    <div id="upload-overlay" class="upload-overlay"><div class="spinner"></div><div style="font-weight:700; color:var(--primary);">전송 중...</div></div>
    
    <nav id="global-nav" class="scrolled">
        <a href="/" class="brand">SORIGRIM</a>
        <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← 관리 홈으로</a>
    </nav>

    <main class="container">
        <div class="editor-layout">
            <div class="editor-main">
                <form id="editor-form">
                    <div class="form-group"><label>작품 제목</label><input type="text" id="title" required></div>
                    
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
                        <div class="form-group"><label>카테고리</label><select id="category" required></select></div>
                        <div class="form-group"><label>태그 (쉼표 구분)</label><input type="text" id="tags" placeholder="Cyberpunk, Realistic"></div>
                    </div>

                    <div class="form-group"><label>AI Prompt</label><textarea id="prompt" rows="4"></textarea></div>

                    <div class="form-group">
                        <label>본문 내용</label>
                        <div class="editor-wrapper">
                            <div class="editor-toolbar">
                                <div class="toolbar-group">
                                    <select onchange="execCmd('fontName', this.value)">
                                        <option value="Pretendard Variable">기본 글꼴</option>
                                        <option value="serif">명조체</option>
                                        <option value="monospace">코드체</option>
                                    </select>
                                    <select onchange="execCmd('fontSize', this.value)">
                                        <option value="3">보통</option>
                                        <option value="1">작게</option>
                                        <option value="5">크게</option>
                                        <option value="7">최대</option>
                                    </select>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="execCmd('bold')">B</button>
                                    <button type="button" onclick="execCmd('italic')">I</button>
                                    <button type="button" onclick="execCmd('underline')">U</button>
                                    <input type="color" onchange="execCmd('foreColor', this.value)" style="width:25px; height:25px; border:none; padding:0; background:none; cursor:pointer;">
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="execCmd('justifyLeft')">左</button>
                                    <button type="button" onclick="execCmd('justifyCenter')">中</button>
                                    <button type="button" onclick="execCmd('justifyRight')">右</button>
                                </div>
                                <div class="toolbar-group">
                                    <button type="button" onclick="handleMediaUpload('image')" style="color:var(--primary);">이미지</button>
                                    <button type="button" onclick="handleMediaUpload('video')" style="color:var(--primary);">영상</button>
                                    <button type="button" onclick="promptLink()">🔗</button>
                                    <button type="button" onclick="execCmd('removeFormat')">Clear</button>
                                </div>
                            </div>
                            <div id="content-editor" class="rich-editor" contenteditable="true" spellcheck="false"></div>
                        </div>
                    </div>

                    <div class="bottom-options">
                        <label class="option-item"><input type="checkbox" id="is_published" checked><span>🌐 웹사이트에 즉시 게시</span></label>
                        <label class="option-item"><input type="checkbox" id="is_hero"><span>★ 메인 히어로 사용</span></label>
                        <label class="option-item"><input type="checkbox" id="is_recommended"><span>✔ 추천 작품 등록</span></label>
                    </div>

                    <button type="submit" id="save-btn" class="btn-premium">작품 저장하기</button>
                </form>
            </div>

            <div class="editor-sidebar">
                <div class="sidebar-card">
                    <h4>콘텐츠 진단 (SEO)</h4>
                    <div id="seo-score-list">
                        <div id="check-media" class="seo-check"><div class="status"></div> 미디어 포함 여부</div>
                        <div id="check-length" class="seo-check"><div class="status"></div> 본문 글자 수</div>
                        <div id="check-prompt" class="seo-check"><div class="status"></div> 프롬프트 작성</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="editor-media-upload" style="display:none;" multiple>

    <script type="module">
        const form = document.getElementById('editor-form'); const editor = document.getElementById('content-editor'); const mediaInput = document.getElementById('editor-media-upload');
        const urlParams = new URLSearchParams(window.location.search); const editId = urlParams.get('id');

        async function loadCategories() { 
            const res = await fetch('/api/categories'); const cats = await res.json(); 
            document.getElementById('category').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); 
            if (editId) loadPostData(); 
        }

        async function loadPostData() {
            const res = await fetch(`/api/portfolio?id=${editId}&admin=true`); const d = await res.json();
            document.getElementById('title').value = d.title; 
            document.getElementById('category').value = d.category;
            document.getElementById('tags').value = d.tags || ''; 
            document.getElementById('prompt').value = d.prompt || '';
            editor.innerHTML = d.content || ''; 
            document.getElementById('is_published').checked = d.is_published === 1;
            document.getElementById('is_hero').checked = d.is_hero === 1; 
            document.getElementById('is_recommended').checked = d.is_recommended === 1;
            updateSEO();
        }

        window.execCmd = (c, v = null) => { document.execCommand(c, false, v); editor.focus(); updateSEO(); };
        
        window.promptLink = () => {
            const url = prompt("연결할 URL을 입력하세요:", "https://");
            if (url && url !== "https://") {
                document.execCommand("createLink", false, url);
                // Ensure link opens in new tab
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const container = selection.getRangeAt(0).commonAncestorContainer;
                    const parent = container.nodeType === 3 ? container.parentNode : container;
                    if (parent.tagName === 'A') {
                        parent.setAttribute('target', '_blank');
                        parent.setAttribute('rel', 'noopener noreferrer');
                    }
                }
            }
        };

        window.handleMediaUpload = (t) => {
            mediaInput.accept = t === 'image' ? 'image/*' : 'video/*';
            mediaInput.onchange = async () => {
                const files = Array.from(mediaInput.files);
                if (files.length > 0) {
                    document.getElementById('upload-overlay').style.display='flex';
                    for (const f of files) {
                        const url = await uploadFile(f);
                        if (url) insertMedia(t, url);
                    }
                    document.getElementById('upload-overlay').style.display='none';
                    mediaInput.value='';
                }
            };
            mediaInput.click();
        };

        function insertMedia(t, url) {
            editor.focus();
            const n = t === 'image' ? document.createElement('img') : document.createElement('video');
            n.src = url; n.style.maxWidth = "100%"; n.style.display = "block"; n.style.margin = "2rem 0";
            if (t === 'video') { n.controls = true; n.playsInline = true; }
            editor.appendChild(n);
            editor.appendChild(document.createElement('p')).innerHTML = '<br>';
            updateSEO();
        }

        async function uploadFile(f) {
            const fd = new FormData(); fd.append('file', f);
            try { const res = await fetch('/api/assets', { method: 'POST', body: fd }); const d = await res.json(); return d.url; } catch (e) { return null; }
        }

        // SEO Diagnostic Logic
        function updateSEO() {
            const text = editor.innerText.trim();
            const html = editor.innerHTML;
            const promptVal = document.getElementById('prompt').value.trim();

            const hasMedia = html.includes('<img') || html.includes('<video');
            const isLongEnough = text.length > 50;
            const hasPrompt = promptVal.length > 0;

            toggleCheck('check-media', hasMedia ? 'pass' : 'fail');
            toggleCheck('check-length', isLongEnough ? 'pass' : 'warn');
            toggleCheck('check-prompt', hasPrompt ? 'pass' : 'fail');
        }

        function toggleCheck(id, status) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.remove('pass', 'warn', 'fail');
            el.classList.add(status);
        }

        editor.addEventListener('input', updateSEO);
        document.getElementById('prompt').addEventListener('input', updateSEO);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const div = document.createElement('div'); div.innerHTML = editor.innerHTML;
            const first = div.querySelector('img, video');
            const data = { 
                title: document.getElementById('title').value, 
                category: document.getElementById('category').value, 
                tags: document.getElementById('tags').value, 
                prompt: document.getElementById('prompt').value, 
                content: editor.innerHTML, 
                image: first ? first.src : '', 
                is_published: document.getElementById('is_published').checked, 
                is_hero: document.getElementById('is_hero').checked, 
                is_recommended: document.getElementById('is_recommended').checked 
            };
            const res = await fetch('/api/portfolio' + (editId ? `?id=${editId}` : ''), { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data) 
            });
            if (res.ok) window.location.href = 'dashboard.html';
            else alert('저장 중 오류가 발생했습니다.');
        });

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
