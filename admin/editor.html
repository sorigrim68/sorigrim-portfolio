<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorigrim | 글 작성 및 수정</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .editor-container { padding: 8rem 0; max-width: 1000px; }
        .form-group { margin-bottom: 3rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); margin-bottom: 1rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1.2rem; background: var(--bg-light); border: 1px solid var(--border);
            color: var(--text-main); font-family: inherit; font-size: 1rem; border-radius: 4px;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        .editor-card { background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .editor-toolbar {
            display: flex; gap: 0.5rem; padding: 1rem; background: var(--bg-light); 
            border-bottom: 1px solid var(--border); flex-wrap: wrap;
        }
        .editor-toolbar .group { display: flex; gap: 0.3rem; border-right: 1px solid var(--border); padding-right: 0.5rem; margin-right: 0.5rem; }
        .editor-toolbar .group:last-child { border-right: none; }
        
        .editor-toolbar button {
            background: none; border: 1px solid transparent; color: var(--text-muted);
            padding: 0.5rem 0.8rem; font-size: 0.75rem; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .editor-toolbar button:hover { color: var(--primary); background: white; }

        .rich-editor {
            min-height: 600px; padding: 4rem; color: var(--text-main); font-family: var(--font-main); 
            font-size: 1.1rem; line-height: 1.8; outline: none;
        }
        .rich-editor h2 { font-size: 2.5rem; margin: 3rem 0 1.5rem; font-weight: 800; }
        .rich-editor img, .rich-editor video { max-width: 100%; height: auto; margin: 3rem 0; border-radius: 4px; }
        
        #thumb-preview img, #thumb-preview video { width: 100%; height: 100%; object-fit: cover; }

        .upload-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; gap: 2rem; }
        .upload-overlay .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="upload-overlay" class="upload-overlay">
        <div class="spinner"></div>
        <div style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">파일을 업로드 중입니다...</div>
    </div>

    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <a href="dashboard.html" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">← 관리 홈으로</a>
    </nav>

    <main class="container editor-container">
        <form id="editor-form">
            <div class="form-group"><label>제목</label><input type="text" id="title" placeholder="작품 제목을 입력하세요..." required></div>
            <div class="form-group"><label>카테고리</label><select id="category">
                <option value="PHOTO WORK">사진 작업 (PHOTO)</option>
                <option value="VIDEO WORK">영상 작업 (VIDEO)</option>
                <option value="PROMPT SHARE">프롬프트 공유</option>
                <option value="AI NEWS">AI 뉴스</option>
            </select></div>
            
            <div class="form-group">
                <label>작품 썸네일</label>
                <div style="display: flex; gap: 2rem; align-items: flex-start; background: var(--bg-light); padding: 2rem; border-radius: 8px; border: 1px solid var(--border);">
                    <div id="thumb-preview" style="width: 150px; aspect-ratio: 1; background: white; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">미디어 없음</span>
                    </div>
                    <div style="flex: 1;">
                        <input type="url" id="image" placeholder="직접 URL을 입력하거나 아래 버튼으로 업로드하세요..." style="margin-bottom: 1rem; background: white;">
                        <div style="display: flex; gap: 1rem;">
                            <input type="file" id="thumb-upload" style="display: none;" accept="image/*,video/*">
                            <button type="button" class="btn-premium" style="padding: 0.8rem 1.5rem; font-size: 0.75rem;" onclick="document.getElementById('thumb-upload').click()">파일 업로드</button>
                            <button type="button" class="btn-premium" style="padding: 0.8rem 1.5rem; font-size: 0.75rem; background: white; color: var(--primary); border: 1px solid var(--primary);" onclick="autoExtractThumb()">본문에서 추출</button>
                        </div>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem;">* 아카이브 목록에 표시될 대표 이미지나 영상입니다.</p>
                    </div>
                </div>
            </div>

            <div class="form-group"><label>짧은 소개글</label><textarea id="description" rows="2" placeholder="작품에 대한 간단한 설명을 입력하세요..."></textarea></div>
            
            <div class="form-group">
                <label>본문 내용 (리치 에디터)</label>
                <div class="editor-card">
                    <div class="editor-toolbar">
                        <div class="group">
                            <button type="button" onclick="execCmd('formatBlock', 'H2')">제목</button>
                            <button type="button" onclick="execCmd('formatBlock', 'P')">본문</button>
                        </div>
                        <div class="group">
                            <button type="button" onclick="execCmd('bold')"><b>가</b></button>
                            <button type="button" onclick="execCmd('italic')"><i>가</i></button>
                        </div>
                        <div class="group">
                            <button type="button" onclick="insertMedia('image')">+ 이미지 추가</button>
                            <button type="button" onclick="insertMedia('video')">+ 영상 추가</button>
                        </div>
                    </div>
                    <div id="content-editor" class="rich-editor" contenteditable="true" spellcheck="false"></div>
                </div>
                <input type="file" id="editor-media-upload" style="display: none;">
            </div>

            <div class="form-group" style="display:flex; align-items:center; gap:1rem; background: var(--bg-light); padding: 2rem; border-radius: 8px;">
                <input type="checkbox" id="is_recommended" style="width: auto;">
                <label style="margin-bottom:0;">메인 페이지 '주요 작품선'에 노출</label>
            </div>
            <button type="submit" class="btn-premium" style="width: 100%; padding: 2rem; font-size: 1.1rem;">작품 저장하기</button>
        </form>
    </main>

    <script type="module">
        const form = document.getElementById('editor-form');
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        const editor = document.getElementById('content-editor');
        const overlay = document.getElementById('upload-overlay');
        const thumbInput = document.getElementById('image');
        const thumbPreview = document.getElementById('thumb-preview');

        window.execCmd = (cmd, val = null) => {
            document.execCommand(cmd, false, val);
            editor.focus();
        };

        window.insertMedia = (type) => {
            const upload = document.getElementById('editor-media-upload');
            upload.accept = type === 'image' ? 'image/*' : 'video/*';
            upload.onchange = async () => {
                if (upload.files[0]) {
                    overlay.style.display = 'flex';
                    const url = await uploadFile(upload.files[0]);
                    overlay.style.display = 'none';
                    if (url) {
                        if (type === 'image') {
                            document.execCommand('insertHTML', false, `<img src="${url}" alt="작품 이미지">`);
                        } else {
                            const video = `<video controls playsinline src="${url}" style="max-width:100%"></video><p><br></p>`;
                            document.execCommand('insertHTML', false, video);
                        }
                    }
                }
            };
            upload.click();
        };

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/api/assets', { method: 'POST', body: formData });
                const data = await res.json();
                return data.url;
            } catch (e) {
                alert('파일 업로드에 실패했습니다.');
                return null;
            }
        }

        function updateThumbPreview(url) {
            if (!url) {
                thumbPreview.innerHTML = `<span style="font-size: 0.75rem; color: var(--text-muted);">미디어 없음</span>`;
                return;
            }
            if (url.match(/\.(mp4|webm|ogg)$/) || url.includes('video')) {
                thumbPreview.innerHTML = `<video src="${url}" muted loop autoplay playsinline></video>`;
            } else {
                thumbPreview.innerHTML = `<img src="${url}" alt="미리보기">`;
            }
        }

        thumbInput.addEventListener('input', (e) => updateThumbPreview(e.target.value));

        document.getElementById('thumb-upload').onchange = async (e) => {
            if (e.target.files[0]) {
                overlay.style.display = 'flex';
                const url = await uploadFile(e.target.files[0]);
                overlay.style.display = 'none';
                if (url) {
                    thumbInput.value = url;
                    updateThumbPreview(url);
                }
            }
        };

        window.autoExtractThumb = () => {
            const thumb = extractThumbnail(editor.innerHTML);
            if (thumb) {
                thumbInput.value = thumb;
                updateThumbPreview(thumb);
            } else {
                alert("본문에 삽입된 이미지나 영상이 없습니다.");
            }
        };

        function extractThumbnail(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            const img = div.querySelector('img');
            if (img) return img.src;
            const video = div.querySelector('video');
            if (video) return video.src;
            return null;
        }

        if (editId) {
            fetch(`/api/portfolio?id=${editId}`).then(r => r.json()).then(data => {
                document.getElementById('title').value = data.title;
                document.getElementById('category').value = data.category;
                thumbInput.value = data.image || '';
                updateThumbPreview(data.image);
                document.getElementById('description').value = data.description || '';
                editor.innerHTML = data.content || '';
                document.getElementById('is_recommended').checked = data.is_recommended === 1;
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                image: thumbInput.value,
                description: document.getElementById('description').value,
                content: editor.innerHTML,
                is_recommended: document.getElementById('is_recommended').checked
            };
            
            try {
                const res = await fetch('/api/portfolio' + (editId ? `?id=${editId}` : ''), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('성공적으로 저장되었습니다.');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('저장 중 오류가 발생했습니다.');
            }
        });
    </script>
</body>
</html>
