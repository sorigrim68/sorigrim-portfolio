<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN — SORIGRIM ADMIN</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: #FFF; padding: 4rem; border-radius: 8px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        .login-card h1 { font-size: 1.8rem; font-weight: 900; color: var(--primary); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .login-card p { font-size: 0.9rem; color: #666; margin-bottom: 3rem; }
        .form-group { margin-bottom: 2rem; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 800; color: #999; margin-bottom: 0.8rem; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 1.2rem; border: 1px solid #EEE; border-radius: 4px; font-size: 1.1rem; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 1.2rem; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #0044CC; transform: translateY(-3px); }
        .error-msg { color: #dc3545; font-size: 0.85rem; font-weight: 700; margin-top: 1.5rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>SORIGRIM.</h1>
        <p>관리자 영역 보호를 위한 인증이 필요합니다.</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required autofocus>
            </div>
            <button type="submit" class="btn-login">인증 및 입장하기</button>
            <div id="error-msg" class="error-msg">비밀번호가 올바르지 않습니다.</div>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    // 인증 성공 시 대시보드로 이동
                    window.location.href = '/admin/dashboard.html';
                } else {
                    errorMsg.style.display = 'block';
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                alert('인증 중 오류가 발생했습니다.');
            }
        });
    </script>
</body>
</html>
