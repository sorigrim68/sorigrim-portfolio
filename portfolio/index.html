<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브 — sorigrim</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .archive-header { padding: 12rem 0 6rem; background: var(--bg-light); border-bottom: 1px solid var(--border); }
        .filter-nav { display: flex; justify-content: center; gap: 1.5rem; margin: 5rem 0 8rem; flex-wrap: wrap; }
        .filter-nav button {
            background: white; border: 1px solid var(--border); color: var(--text-muted);
            font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            padding: 0.8rem 2.5rem; border-radius: 30px;
        }
        .filter-nav button.active { color: white; background: var(--primary); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,85,255,0.15); }
        .filter-nav button:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="nav-links">
            <a href="/portfolio/">아카이브</a>
        </div>
    </nav>

    <main>
        <header class="archive-header">
            <div class="container">
                <h1 class="reveal section-title">Selected Fragments.</h1>
                <p class="reveal section-desc">우리가 탐구해온 시각적 언어와 기술적 시도들을 기록합니다.</p>
            </div>
        </header>

        <nav class="filter-nav reveal container">
            <button class="active" data-filter="all">전체보기</button>
            <button data-filter="PHOTO WORK">PHOTO</button>
            <button data-filter="VIDEO WORK">VIDEO</button>
            <button data-filter="PROMPT SHARE">PROMPT</button>
            <button data-filter="AI NEWS">NEWS</button>
        </nav>

        <section id="portfolio-list" class="grid-archive container py-xl" style="padding-top: 0;">
            <!-- main.js에 의해 로드됨 -->
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
