<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브 — SORIGRIM</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .archive-header { padding: 12rem 0 4rem; background: var(--bg-light); }
        .search-container { max-width: 600px; margin: 0 auto 4rem; position: relative; }
        .search-input { width: 100%; padding: 1.2rem 2rem; border: 1px solid var(--border); border-radius: 40px; font-size: 1rem; outline: none; background: var(--bg-white); color: var(--text-main); transition: 0.3s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,85,255,0.1); }
        
        .filter-nav { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .filter-nav button { background: var(--bg-white); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.3s; padding: 0.7rem 1.8rem; border-radius: 30px; }
        .filter-nav button.active { color: white; background: var(--primary); border-color: var(--primary); }

        .tag-cloud { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; max-width: 800px; margin: 0 auto 6rem; }
        .tag-cloud a { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-decoration: none; padding: 0.4rem 1rem; border: 1px solid var(--border); border-radius: 20px; transition: 0.3s; }
        .tag-cloud a:hover, .tag-cloud a.active { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
<body>
    <nav id="global-nav" class="scrolled"><a href="/" class="brand">SORIGRIM</a><div class="nav-links"><a href="/portfolio/">아카이브</a></div></nav>
    <main>
        <header class="archive-header">
            <div class="container">
                <h1 class="reveal section-title" style="text-align:center;">Artistic Fragments.</h1>
                <div class="search-container reveal">
                    <input type="text" id="search-input" class="search-input" placeholder="제목이나 태그로 검색하세요...">
                </div>
                <nav id="dynamic-filter-nav" class="filter-nav reveal"><button class="active" data-filter="all">전체보기</button></nav>
                <div id="tag-cloud" class="tag-cloud reveal"></div>
            </div>
        </header>
        <section id="portfolio-list" class="grid-archive container py-xl" style="padding-top: 0;"></section>
    </main>
    <sg-footer></sg-footer>
    <script defer src="/main.js" type="module"></script>
    <script type="module">
        let currentCategory = 'all';
        let currentSearch = '';
        let currentTag = '';

        async function initArchive() {
            const urlParams = new URLSearchParams(window.location.search);
            currentCategory = urlParams.get('category') || 'all';
            currentTag = urlParams.get('tag') || '';
            if (currentTag) document.getElementById('search-input').value = currentTag;

            await loadCategories();
            await loadAllTags();
            updateList();
        }

        async function loadCategories() {
            const res = await fetch('/api/categories'); const cats = await res.json();
            const nav = document.getElementById('dynamic-filter-nav');
            cats.forEach(cat => {
                const btn = document.createElement('button'); btn.textContent = cat.name;
                if (cat.name === currentCategory) btn.classList.add('active');
                btn.onclick = () => {
                    nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active'); currentCategory = cat.name; updateList();
                };
                nav.appendChild(btn);
            });
        }

        async function loadAllTags() {
            const res = await fetch('/api/portfolio'); const posts = await res.json();
            const tags = new Set();
            posts.forEach(p => (p.tags || '').split(',').forEach(t => t.trim() && tags.add(t.trim())));
            const cloud = document.getElementById('tag-cloud');
            cloud.innerHTML = Array.from(tags).map(t => `<a href="#" class="${t === currentTag ? 'active' : ''}" onclick="filterByTag(event, '${t}')">#${t}</a>`).join('');
        }

        window.filterByTag = (e, tag) => {
            e.preventDefault();
            document.querySelectorAll('#tag-cloud a').forEach(a => a.classList.remove('active'));
            if (currentTag === tag) { currentTag = ''; } 
            else { currentTag = tag; e.target.classList.add('active'); }
            updateList();
        };

        async function updateList() {
            const grid = document.getElementById('portfolio-list');
            grid.innerHTML = Array(4).fill('<div class="archive-card skeleton" style="height:300px;"></div>').join('');
            
            let url = `/api/portfolio?category=${encodeURIComponent(currentCategory)}`;
            if (currentSearch) url += `&search=${encodeURIComponent(currentSearch)}`;
            if (currentTag) url += `&tag=${encodeURIComponent(currentTag)}`;
            
            const res = await fetch(url); const works = await res.json();
            grid.innerHTML = works.length ? works.map((w, i) => window.renderTechnicalCard(w, i)).join('') : '<div style="grid-column:1/-1; text-align:center; padding:4rem; color:#999;">검색 결과가 없습니다.</div>';
            setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('active')), 100);
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(updateList, 500);
        });

        document.addEventListener('DOMContentLoaded', initArchive);
    </script>
</body>
</html>
