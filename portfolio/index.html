<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — sorigrim</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Archive Page Specific Styles */
        .archive-header {
            padding: 15rem 0 8rem;
            text-align: center;
            background: linear-gradient(to bottom, var(--sori-bg), oklch(15% 0.02 240));
        }
        .filter-nav {
            display: flex; justify-content: center; gap: 4rem;
            margin-bottom: 10rem;
        }
        .filter-nav button {
            background: none; border: none; color: var(--sori-muted);
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.3em; cursor: pointer; transition: 0.4s var(--ease-premium);
        }
        .filter-nav button.active, .filter-nav button:hover { color: var(--sori-fg); transform: translateY(-2px); }

        .archive-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 6rem; padding: 0 6rem 15rem;
        }
        .archive-card { cursor: pointer; position: relative; }
        .archive-card .img-box {
            aspect-ratio: 4 / 5; overflow: hidden; background: #111;
            box-shadow: var(--shadow-soft); transition: var(--ease-premium);
        }
        .archive-card img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s var(--ease-premium); filter: grayscale(0.1); }
        .archive-card:hover .img-box { box-shadow: var(--shadow-deep); transform: translateY(-10px); }
        .archive-card:hover img { transform: scale(1.05); filter: grayscale(0); }

        .card-meta { margin-top: 2rem; }
        .card-meta .tag { font-size: 0.65rem; color: var(--sori-accent); font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; }
        .card-meta h3 { font-family: var(--font-editorial); font-size: 2.2rem; font-weight: 400; font-style: italic; margin-top: 0.8rem; }

        @media (max-width: 1024px) { .archive-grid { grid-template-columns: 1fr; padding: 0 2rem 10rem; } }
    </style>
</head>
<body>
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="nav-links">
            <a href="/portfolio/" style="opacity: 1;">Archive</a>
            <a href="/cta.html">Connect</a>
        </div>
    </nav>

    <main>
        <header class="archive-header">
            <div class="container">
                <h1 class="reveal">Selected Fragments.</h1>
            </div>
        </header>

        <nav class="filter-nav reveal">
            <button class="active" data-filter="all">All</button>
            <button data-filter="PHOTO WORK">Photo</button>
            <button data-filter="VIDEO WORK">Video</button>
            <button data-filter="PROMPT SHARE">Prompts</button>
            <button data-filter="AI NEWS">News</button>
        </nav>

        <section id="portfolio-list" class="archive-grid">
            <!-- Dynamic Content via main.js -->
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>
</html>
