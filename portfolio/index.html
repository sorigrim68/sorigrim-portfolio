<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive — sorigrim</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Portfolio Specific Styles */
        .archive-hero {
            padding: 12rem 0 6rem;
            text-align: center;
            background: linear-gradient(to bottom, var(--sori-bg), oklch(20% 0.02 240));
        }
        .filter-nav {
            display: flex; justify-content: center; gap: 3rem; margin-bottom: 8rem;
        }
        .filter-nav button {
            background: none; border: none; color: var(--sori-muted);
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.2em; cursor: pointer; transition: 0.3s;
        }
        .filter-nav button.active, .filter-nav button:hover { color: var(--sori-fg); }
        
        .grid-full {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 4rem; padding: 0 4rem 12rem;
        }
        .archive-card { position: relative; overflow: hidden; cursor: pointer; }
        .archive-card .img-container { aspect-ratio: 16/10; overflow: hidden; background: #1a1a1a; }
        .archive-card img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition-premium); }
        .archive-card:hover img { transform: scale(1.05); }
        
        .card-info { margin-top: 1.5rem; }
        .card-info .tag { font-size: 0.6rem; color: var(--sori-accent); text-transform: uppercase; letter-spacing: 0.15em; font-weight: 800; }
        .card-info h3 { font-family: var(--font-editorial); font-size: 2rem; font-weight: 400; margin-top: 0.5rem; font-style: italic; }

        @media (max-width: 768px) {
            .grid-full { grid-template-columns: 1fr; padding: 0 2rem 8rem; }
            .filter-nav { gap: 1rem; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="links">
            <a href="/portfolio/" style="opacity: 1;">Archive</a>
            <a href="/cta.html">Connect</a>
        </div>
    </nav>

    <main>
        <header class="archive-hero">
            <div class="container">
                <h1 class="reveal-up">Fragmented Records.</h1>
            </div>
        </header>

        <nav class="filter-nav reveal-up">
            <button class="active" data-filter="all">All</button>
            <button data-filter="PHOTO WORK">Photo</button>
            <button data-filter="VIDEO WORK">Video</button>
            <button data-filter="PROMPT SHARE">Prompts</button>
            <button data-filter="AI NEWS">News</button>
        </nav>

        <section id="archive-grid" class="grid-full reveal-up">
            <!-- Dynamic Content -->
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.reveal-up').forEach(el => el.classList.add('active'));
            }, 100);
        });
    </script>
</body>
</html>
