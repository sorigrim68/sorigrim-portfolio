<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브 — SORIGRIM</title>
    <meta name="description" content="AI ART, IMAGE, VIDEO, PROMPT curation.">
    <link rel="stylesheet" href="/style.css">
    <style>
        .archive-header { padding: 12rem 0 6rem; background: var(--bg-light); border-bottom: 1px solid var(--border); }
        .filter-nav { display: flex; justify-content: center; gap: 0.8rem; margin: 4rem 0 6rem; flex-wrap: wrap; }
        .filter-nav button {
            background: white; border: 1px solid var(--border); color: var(--text-muted);
            font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            padding: 0.7rem 1.8rem; border-radius: 30px; white-space: nowrap;
        }
        .filter-nav button.active { color: white; background: var(--primary); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0,85,255,0.15); }
        
        @media (max-width: 768px) {
            .archive-header { padding: 8rem 0 4rem; }
            .filter-nav { margin: 3rem 0 4rem; gap: 0.5rem; }
            .filter-nav button { padding: 0.6rem 1.2rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <nav id="global-nav" class="scrolled">
        <a href="/" class="brand">SORIGRIM</a>
        <div class="nav-links">
            <a href="/portfolio/">아카이브</a>
        </div>
    </nav>

    <main>
        <header class="archive-header">
            <div class="container">
                <h1 class="reveal section-title">Artistic Fragments.</h1>
                <p class="reveal section-desc">관리자님이 구성한 카테고리별 AI 시각적 탐구의 기록들입니다.</p>
            </div>
        </header>

        <nav id="dynamic-filter-nav" class="filter-nav reveal container">
            <button class="active" data-filter="all">전체보기</button>
        </nav>

        <section id="portfolio-list" class="grid-archive container py-xl" style="padding-top: 0;">
            <!-- main.js 로드 -->
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script type="module">
        async function initDynamicFilters() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeCat = urlParams.get('category') || 'all';

            try {
                const res = await fetch('/api/categories');
                const cats = await res.json();
                const nav = document.getElementById('dynamic-filter-nav');
                
                // 전체보기 버튼 상태 처리
                const allBtn = nav.querySelector('button[data-filter="all"]');
                if (activeCat === 'all') allBtn.classList.add('active');
                else allBtn.classList.remove('active');
                allBtn.onclick = () => {
                    nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    allBtn.classList.add('active');
                    if (window.loadArchiveInternal) window.loadArchiveInternal('all');
                };

                cats.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.textContent = cat.name;
                    btn.setAttribute('data-filter', cat.name);
                    if (cat.name === activeCat) btn.classList.add('active');
                    btn.onclick = () => {
                        nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        if (window.loadArchiveInternal) window.loadArchiveInternal(cat.name);
                    };
                    nav.appendChild(btn);
                });
            } catch (e) {}
        }
        document.addEventListener('DOMContentLoaded', initDynamicFilters);
    </script>
</body>
</html>
