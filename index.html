<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORIGRIM — AI Art & Cinematic Vision</title>
    <meta name="description" content="SORIGRIM: AI ART, IMAGE, VIDEO, and PROMPT curation.">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="global-nav">
      <a href="/" class="brand">SORIGRIM</a>
      <div class="nav-links">
        <a href="/portfolio/">아카이브</a>
      </div>
    </nav>

    <main>
        <section id="hero">
            <div class="hero-media" id="hero-video-container">
                <!-- Dynamically Injected -->
            </div>
            <div class="hero-content">
                <h1 class="reveal">Sculpting Vision<br>with AI & Prompt.</h1>
                <p class="reveal">프롬프트와 알고리즘이 만나는 접점에서 시네마틱한 미학을 탐구합니다.<br>나의 AI ART 작업물과 정제된 AI IMAGE, VIDEO 조각들을 경험해보세요.</p>
                <div class="reveal">
                    <a href="/portfolio/" class="btn-premium">아카이브 탐색하기</a>
                </div>
            </div>
        </section>

        <section id="recommended" class="py-xl" style="background: var(--bg-light);">
            <div class="container">
                <h2 class="reveal section-title">Featured Artworks.</h2>
                <p class="reveal section-desc">AI 이미지와 영상, 그리고 프롬프트 공유를 위한 엄선된 작업물입니다.</p>
                <div id="recommended-grid" class="grid-archive">
                    <!-- main.js에 의해 동적으로 삽입됨 -->
                </div>
            </div>
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.15 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
