<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorigrim — 전문 생성 비전 포트폴리오</title>
    <meta name="description" content="sorigrim: 시네마틱 AI 비전과 생성형 프래그먼트를 위한 전문 포트폴리오 플랫폼입니다.">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorigrim.com/">
    <meta property="og:title" content="sorigrim — 전문 생성 비전 포트폴리오">
    <meta property="og:description" content="시네마틱 AI 비전과 프롬프트를 정제하는 전문 플랫폼.">
    <meta property="og:image" content="https://sorigrim.com/api/assets?name=og-image.jpg">

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="global-nav">
      <a href="/" class="brand">sorigrim</a>
      <div class="nav-links">
        <a href="/portfolio/">아카이브</a>
      </div>
    </nav>

    <main>
        <!-- DMS Style Hero: Full Viewport Overlay -->
        <section id="hero">
            <div class="hero-media" id="hero-video-container">
                <!-- Video or Image injected via main.js -->
            </div>
            <div class="hero-content">
                <h1 class="reveal">Pioneering the<br>Generative Horizon.</h1>
                <p class="reveal">기술적 정교함과 시네마틱한 통찰력으로 프롬프트와 지각 사이의 경계를 정제하는 프리미엄 비전 플랫폼입니다.</p>
                <div class="reveal">
                    <a href="/portfolio/" class="btn-premium">전체 아카이브 보기</a>
                </div>
            </div>
        </section>

        <section id="recommended" class="py-xl" style="background: var(--bg-light);">
            <div class="container" style="margin-bottom: 6rem;">
                <h2 class="reveal" style="font-size: 2.8rem; font-weight: 850; letter-spacing: -0.03em;">Featured Selections.</h2>
                <p class="reveal" style="color: var(--text-muted); margin-top: 1rem; font-size: 1.1rem;">우리의 최신 기술적 시도와 미학적 결과물을 담은 주요 작품들입니다.</p>
            </div>
            <div id="recommended-grid" class="grid-archive container">
                <!-- main.js에 의해 동적으로 삽입됨 -->
            </div>
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
