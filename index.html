<head>
    <meta charset="UTF-8">

    <meta name="description" content="sorigrim: Refining the boundary between prompt and perception. A cinematic AI vision portfolio.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorigrim.com/">
    <meta property="og:title" content="sorigrim — Genesis of Generative Vision">
    <meta property="og:description" content="Refining the boundary between prompt and perception. A cinematic AI vision portfolio.">
    <meta property="og:image" content="https://sorigrim.com/api/assets?name=og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://sorigrim.com/">
    <meta property="twitter:title" content="sorigrim — Genesis of Generative Vision">
    <meta property="twitter:description" content="Refining the boundary between prompt and perception. A cinematic AI vision portfolio.">
    <meta property="twitter:image" content="https://sorigrim.com/api/assets?name=og-image.jpg">

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Global Navigation -->
    <nav id="global-nav">
      <a href="/" class="brand">sorigrim</a>
      <div class="nav-links">
        <a href="/portfolio/">Archive</a>
      </div>
    </nav>

    <main>
        <!-- New Layout: Video Top, Content Below -->
        <section id="hero">
            <div class="hero-media">
                <video id="hero-video" autoplay muted loop playsinline preload="auto"></video>
            </div>
            <div class="hero-content">
                <h1>The Genesis of Generative Vision.</h1>
                <p>Refining the boundary between prompt and perception.</p>
                <a href="/portfolio/" class="btn-premium">Enter Archive</a>
            </div>
        </section>

        <!-- Recommended Selection -->
        <section id="recommended" class="py-xl">
            <div class="container" style="margin-bottom: 6rem;">
                <h2 class="reveal">Curated Echoes.</h2>
            </div>
            <div id="recommended-grid" class="grid-archive">
                <!-- Dynamically injected via main.js -->
            </div>
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        // Simple Intersection Observer for Reveals
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
