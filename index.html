<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorigrim — Genesis</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Global Navigation -->
    <nav id="global-nav">
        <a href="/" class="brand">sorigrim</a>
        <div class="nav-links">
            <a href="/portfolio/">Archive</a>
            <a href="/cta.html">Connect</a>
        </div>
    </nav>

    <main>
        <!-- Full-bleed Cinematic Hero -->
        <section id="hero">
            <div class="hero-media">
                <video autoplay muted loop playsinline>
                    <source src="/api/assets?name=hero-bg.mp4" type="video/mp4">
                </video>
            </div>
            <div class="hero-content">
                <h1>The Genesis of Generative Vision.</h1>
                <p>Refining the boundary between prompt and perception.</p>
                <a href="/portfolio/" class="btn-premium">Enter Archive</a>
            </div>
        </section>

        <!-- Recommended Selection -->
        <section id="recommended" class="py-xl">
            <div class="container" style="margin-bottom: 6rem;">
                <h2 class="reveal">Curated Echoes.</h2>
            </div>
            <div id="recommended-grid" class="grid-archive">
                <!-- Dynamically injected via main.js -->
            </div>
        </section>
    </main>

    <script defer src="/main.js" type="module"></script>
    <script>
        // Simple Intersection Observer for Reveals
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
