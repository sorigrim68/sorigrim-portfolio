<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorigrim — Professional Generative Vision</title>
    <meta name="description" content="sorigrim: Professional portfolio for cinematic AI vision and generative fragments.">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sorigrim.com/">
    <meta property="og:title" content="sorigrim — Professional Generative Vision">
    <meta property="og:description" content="Professional portfolio for cinematic AI vision.">
    <meta property="og:image" content="https://sorigrim.com/api/assets?name=og-image.jpg">

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav id="global-nav">
      <a href="/" class="brand">sorigrim</a>
      <div class="nav-links">
        <a href="/portfolio/">Archive</a>
      </div>
    </nav>

    <main>
        <section id="hero">
            <div class="hero-media" id="hero-video-container">
                <!-- Video or Image injected via main.js -->
            </div>
            <div class="hero-content">
                <h1 class="reveal">Pioneering the<br>Generative Horizon.</h1>
                <p class="reveal">Refining the boundary between prompt and perception with technical precision and cinematic vision.</p>
                <a href="/portfolio/" class="btn-premium reveal">View Full Archive</a>
            </div>
        </section>

        <section id="recommended" class="py-xl" style="background: var(--bg-light);">
            <div class="container" style="margin-bottom: 5rem;">
                <h2 class="reveal" style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em;">Featured Selections.</h2>
                <p class="reveal" style="color: var(--text-muted); margin-top: 1rem;">Curated fragments showcasing our latest vision developments.</p>
            </div>
            <div id="recommended-grid" class="grid-archive container">
                <!-- Dynamically injected via main.js -->
            </div>
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
