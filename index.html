<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sorigrim — 전문 생성 비전 포트폴리오</title>
    <meta name="description" content="시네마틱 AI 비전과 기술적 정교함으로 프롬프트와 지각 사이의 경계를 정제하는 전문 포트폴리오 플랫폼.">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Adaptive Navigation -->
    <nav id="global-nav">
      <a href="/" class="brand">sorigrim</a>
      <div class="nav-links">
        <a href="/portfolio/">아카이브</a>
      </div>
    </nav>

    <main>
        <!-- High-End Hero Section -->
        <section id="hero">
            <div class="hero-media" id="hero-video-container">
                <!-- Dynamically Injected -->
            </div>
            <div class="hero-content">
                <h1 class="reveal">Pioneering the<br>Generative Horizon.</h1>
                <p class="reveal">우리는 기술적 정교함과 시네마틱한 통찰력을 결합하여,<br>인공지능이 생성하는 새로운 시각적 언어의 지평을 개척합니다.</p>
                <div class="reveal">
                    <a href="/portfolio/" class="btn-premium">전체 아카이브 보기</a>
                </div>
            </div>
        </section>

        <!-- Featured Selection Section -->
        <section id="recommended" class="py-xl" style="background: var(--bg-light);">
            <div class="container">
                <h2 class="reveal section-title">Featured Selections.</h2>
                <p class="reveal section-desc">우리의 최신 기술적 시도와 미학적 결과물을 담은 주요 작품들입니다.</p>
                <div id="recommended-grid" class="grid-archive">
                    <!-- main.js에 의해 동적으로 삽입됨 -->
                </div>
            </div>
        </section>
    </main>

    <sg-footer></sg-footer>

    <script defer src="/main.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.15 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
