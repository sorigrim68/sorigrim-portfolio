<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Gallery — SORIGRIM</title>
    <meta name="description" content="AI 영상·이미지 생성에 바로 쓸 수 있는 991개 프롬프트 컬렉션. Seedance 2.0 기반, 필터링 및 복사 가능.">
    <link rel="canonical" href="https://sorigrim.com/prompts/">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .pg-page { padding-top: 7rem; min-height: 100vh; }
        .pg-header { padding: 4rem 0 2.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
        .pg-header h1 { font-size: clamp(2.2rem, 5vw, 4rem); font-weight: 800; letter-spacing: -0.04em; margin-bottom: .7rem; }
        .pg-header p  { color: var(--text-muted); font-size: 1.05rem; max-width: 560px; line-height: 1.7; }
        .pg-meta { margin-top: 1rem; font-size: .78rem; color: var(--text-muted); }
        .pg-meta a { color: var(--primary); text-decoration: none; }

        /* Search */
        .pg-search-wrap { position: relative; margin-bottom: 1.8rem; max-width: 460px; }
        .pg-search-wrap svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        #pg-search { width: 100%; padding: .72rem 1rem .72rem 2.8rem; border: 1px solid var(--border); background: var(--bg-white); color: var(--text-main); font-size: .9rem; border-radius: 8px; font-family: inherit; transition: .25s; }
        #pg-search:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212,175,55,.12); }

        /* Filters */
        .pg-filters { display: flex; flex-direction: column; gap: .9rem; margin-bottom: 2rem; }
        .pg-filter-row { display: flex; align-items: flex-start; gap: 1rem; }
        .pg-filter-label { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--text-muted); white-space: nowrap; min-width: 3.2rem; padding-top: .42rem; }
        .pg-tags { display: flex; gap: .4rem; flex-wrap: wrap; }
        .pg-tag { padding: .35rem .9rem; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: .76rem; font-weight: 600; border-radius: 100px; cursor: pointer; transition: .2s; font-family: inherit; white-space: nowrap; line-height: 1.4; }
        .pg-tag:hover  { border-color: var(--primary); color: var(--primary); }
        .pg-tag.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* Stats + sort */
        .pg-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .8rem; }
        .pg-stats { font-size: .82rem; color: var(--text-muted); }
        .pg-stats strong { color: var(--primary); }
        .pg-sort { font-size: .8rem; color: var(--text-muted); border: 1px solid var(--border); background: transparent; padding: .38rem .8rem; border-radius: 6px; cursor: pointer; font-family: inherit; }

        /* Grid */
        .pg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        @media (max-width: 1100px) { .pg-grid { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px)  { .pg-grid { grid-template-columns: 1fr; } }

        /* Card */
        .pg-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg-white); transition: .45s cubic-bezier(.19,1,.22,1); cursor: pointer; display: flex; flex-direction: column; }
        .pg-card:hover { transform: translateY(-7px); border-color: var(--primary); box-shadow: 0 18px 48px rgba(0,0,0,.09); }

        .pg-thumb { height: 158px; position: relative; overflow: hidden; background: #111; flex-shrink: 0; }
        .pg-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.19,1,.22,1); display: block; }
        .pg-card:hover .pg-thumb img { transform: scale(1.06); }
        .pg-thumb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#111 0%,#1a2040 100%); }
        .pg-thumb-ph svg { opacity: .2; }
        .pg-type { position: absolute; top: .75rem; left: .75rem; z-index: 2; font-size: .62rem; font-weight: 800; letter-spacing: .12em; color: rgba(255,255,255,.92); background: rgba(0,0,0,.5); padding: .25rem .6rem; border-radius: 100px; backdrop-filter: blur(6px); }
        .pg-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; }
        .pg-play svg { opacity: 0; transform: scale(.75); transition: .3s; filter: drop-shadow(0 2px 8px rgba(0,0,0,.5)); }
        .pg-card:hover .pg-play svg { opacity: 1; transform: scale(1); }

        .pg-body { padding: 1.2rem; display: flex; flex-direction: column; gap: .75rem; flex: 1; }
        .pg-badges { display: flex; gap: .35rem; flex-wrap: wrap; }
        .pg-badge { font-size: .65rem; font-weight: 700; color: var(--primary); background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.22); padding: .18rem .55rem; border-radius: 100px; text-transform: uppercase; letter-spacing: .05em; }
        .pg-prompt { font-size: .85rem; color: var(--text-muted); line-height: 1.65; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .pg-actions { display: flex; gap: .5rem; }
        .pg-btn { display: inline-flex; align-items: center; gap: .38rem; padding: .5rem .9rem; font-size: .76rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: .2s; font-family: inherit; border: 1px solid var(--border); background: transparent; color: var(--text-muted); white-space: nowrap; }
        .pg-btn:hover  { border-color: var(--primary); color: var(--primary); }
        .pg-btn.gold   { background: var(--primary); border-color: var(--primary); color: #fff; }
        .pg-btn.gold:hover { background: #b8960f; }
        .pg-btn.copied { background: #22c55e; border-color: #22c55e; color: #fff; }

        /* Pagination */
        .pg-pagination { display: flex; justify-content: center; align-items: center; gap: .6rem; margin: 3rem 0 1rem; flex-wrap: wrap; }
        .pg-page-btn { padding: .5rem .9rem; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: .82rem; border-radius: 6px; cursor: pointer; font-family: inherit; transition: .2s; }
        .pg-page-btn:hover  { border-color: var(--primary); color: var(--primary); }
        .pg-page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .pg-page-btn:disabled { opacity: .35; cursor: not-allowed; }

        /* Empty */
        .pg-empty { display: none; text-align: center; padding: 6rem 0; color: var(--text-muted); }
        .pg-empty svg { opacity: .18; margin-bottom: 1rem; }

        /* Loading */
        .pg-loading { text-align: center; padding: 5rem 0; color: var(--text-muted); }
        .pg-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .pg-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 9999; align-items: center; justify-content: center; padding: 1.2rem; backdrop-filter: blur(10px); }
        .pg-modal-bg.open { display: flex; }
        .pg-modal { background: var(--bg-white); border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
        .pg-modal-close { position: absolute; top: .9rem; right: .9rem; background: rgba(0,0,0,.07); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: var(--text-main); z-index: 10; transition: .2s; }
        .pg-modal-close:hover { background: rgba(212,175,55,.15); color: var(--primary); }
        .pg-modal-video { background: #000; border-radius: 12px 12px 0 0; overflow: hidden; min-height: 180px; display: flex; align-items: center; justify-content: center; }
        .tw-wrap { width: 100%; padding: 1rem; display: flex; justify-content: center; }
        .tw-loading { color: rgba(255,255,255,.35); font-size: .85rem; padding: 2.5rem; text-align: center; }
        .pg-modal-body { padding: 1.8rem; }
        .pg-modal-tags { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .9rem; }
        .pg-modal-prompt { font-size: .88rem; line-height: 1.75; color: var(--text-muted); background: var(--bg-light); border-left: 3px solid var(--primary); border-radius: 0 6px 6px 0; padding: 1.1rem 1.3rem; margin-bottom: 1.4rem; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow-y: auto; }
        .pg-modal-actions { display: flex; gap: .7rem; flex-wrap: wrap; }

        .pg-source { text-align: center; padding: 3rem 0 1.5rem; font-size: .78rem; color: var(--text-muted); }
        .pg-source a { color: var(--primary); text-decoration: none; }

        @media (max-width: 768px) { .pg-page { padding-top: 5rem; } .pg-header { padding: 2rem 0 1.8rem; } }
    </style>
</head>
<body>
    <nav id="global-nav">
        <a href="/" class="brand">SORIGRIM</a>
        <div class="nav-links">
            <a href="/portfolio/">아카이브</a>
            <a href="/prompts/" style="color:var(--primary);">프롬프트</a>
        </div>
    </nav>

    <main class="pg-page">
        <div class="container">

            <div class="pg-header">
                <h1 class="reveal">Prompt Gallery.</h1>
                <p class="reveal">AI 영상·이미지 생성에 바로 쓸 수 있는 프롬프트 컬렉션입니다.<br>카드를 클릭하면 실제 결과 영상을 X(트위터)에서 볼 수 있습니다.</p>
                <p class="pg-meta">Source: <a href="https://www.scenic.sh" target="_blank" rel="noopener">scenic.sh</a> — Seedance 2.0 Prompt Gallery &nbsp;·&nbsp; 영상 원본: X(트위터) 크리에이터</p>
            </div>

            <div id="pg-loading" class="pg-loading">
                <div class="pg-spinner"></div>
                <p>프롬프트 로딩 중...</p>
            </div>

            <div id="pg-app" style="display:none">
                <!-- 검색 -->
                <div class="pg-search-wrap reveal">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="pg-search" placeholder="프롬프트 검색...">
                </div>

                <!-- 필터 -->
                <div class="pg-filters reveal">
                    <div class="pg-filter-row">
                        <span class="pg-filter-label">장르</span>
                        <div class="pg-tags" id="pg-genre-tags"></div>
                    </div>
                    <div class="pg-filter-row">
                        <span class="pg-filter-label">스타일</span>
                        <div class="pg-tags" id="pg-style-tags"></div>
                    </div>
                </div>

                <!-- 툴바 -->
                <div class="pg-toolbar">
                    <p class="pg-stats">총 <strong id="pg-count">0</strong>개</p>
                    <select class="pg-sort" id="pg-sort">
                        <option value="default">최신순</option>
                        <option value="az">프롬프트 가나다순</option>
                    </select>
                </div>

                <!-- 그리드 -->
                <div class="pg-grid" id="pg-grid"></div>

                <!-- 빈 상태 -->
                <div class="pg-empty" id="pg-empty">
                    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <p>검색 결과가 없습니다.</p>
                </div>

                <!-- 페이지네이션 -->
                <div class="pg-pagination" id="pg-pagination"></div>
            </div>

            <div class="pg-source">
                Data: <a href="https://www.scenic.sh" target="_blank" rel="noopener">scenic.sh</a> &nbsp;·&nbsp;
                Videos: <a href="https://x.com" target="_blank" rel="noopener">X (Twitter)</a>
            </div>
        </div>
    </main>

    <!-- 모달 -->
    <div class="pg-modal-bg" id="pg-modal-bg">
        <div class="pg-modal">
            <button class="pg-modal-close" id="pg-modal-close">✕</button>
            <div class="pg-modal-video" id="pg-modal-video"></div>
            <div class="pg-modal-body">
                <div class="pg-modal-tags" id="pg-modal-tags"></div>
                <div class="pg-modal-prompt" id="pg-modal-prompt"></div>
                <div class="pg-modal-actions" id="pg-modal-actions"></div>
            </div>
        </div>
    </div>

    <sg-footer></sg-footer>
    <script defer src="/main.js" type="module"></script>
    <script async src="https://platform.twitter.com/widgets.js"></script>

    <script>
    const PAGE_SIZE = 24;

    // 스타일 태그 목록
    const STYLE_TAGS = new Set([
      'Close Up','Aerial','Tracking','Slow Motion','Timelapse',
      'First Person','Pan','Zoom','Realistic'
    ]);

    let ALL = [];
    let filtered = [];
    let currentPage = 1;
    let activeGenre = 'all';
    let activeStyle = 'all';
    let searchQuery = '';

    // ── 데이터 로드 ──
    async function loadData() {
      const res = await fetch('/prompts/data.json');
      ALL = await res.json();
      document.getElementById('pg-loading').style.display = 'none';
      document.getElementById('pg-app').style.display = 'block';
      buildFilters();
      applyFilters();
      initReveal();
    }

    // ── 필터 빌드 ──
    function buildFilters() {
      const genres = new Set();
      const styles = new Set();
      ALL.forEach(p => p.tags?.forEach(t => {
        if (STYLE_TAGS.has(t)) styles.add(t);
        else genres.add(t);
      }));

      const genreWrap = document.getElementById('pg-genre-tags');
      const styleWrap = document.getElementById('pg-style-tags');
      genreWrap.innerHTML = '';
      styleWrap.innerHTML = '';

      const mkTag = (label, val, isStyle) => {
        const btn = document.createElement('button');
        btn.className = 'pg-tag' + (val === 'all' ? ' active' : '');
        btn.textContent = label;
        btn.onclick = () => {
          const wrap = isStyle ? styleWrap : genreWrap;
          wrap.querySelectorAll('.pg-tag').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (isStyle) activeStyle = val;
          else activeGenre = val;
          currentPage = 1;
          applyFilters();
        };
        return btn;
      };

      genreWrap.appendChild(mkTag('All','all',false));
      [...genres].sort().forEach(t => genreWrap.appendChild(mkTag(t,t,false)));

      styleWrap.appendChild(mkTag('All','all',true));
      [...styles].sort().forEach(t => styleWrap.appendChild(mkTag(t,t,true)));
    }

    // ── 필터 적용 ──
    function applyFilters() {
      const q = searchQuery.toLowerCase();
      filtered = ALL.filter(p => {
        const tags = (p.tags || []).map(t => t.toLowerCase());
        const matchG = activeGenre === 'all' || tags.includes(activeGenre.toLowerCase());
        const matchS = activeStyle === 'all' || tags.includes(activeStyle.toLowerCase());
        const matchQ = !q || (p.prompt || '').toLowerCase().includes(q);
        return matchG && matchS && matchQ;
      });
      renderPage();
    }

    // ── 페이지 렌더 ──
    function renderPage() {
      const total = filtered.length;
      document.getElementById('pg-count').textContent = total;

      const start = (currentPage - 1) * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);

      const grid = document.getElementById('pg-grid');
      grid.innerHTML = '';

      slice.forEach(p => grid.appendChild(buildCard(p)));

      document.getElementById('pg-empty').style.display = total === 0 ? 'block' : 'none';
      renderPagination(total);

      window.scrollTo({ top: document.getElementById('pg-app').offsetTop - 100, behavior: 'smooth' });
    }

    // ── 카드 생성 ──
    function buildCard(p) {
      const tid = p.twitterUrl?.match(/\/status\/(\d+)/)?.[1];
      const imgSrc = p.thumbnail ||
        (tid ? `https://wjvqayfliyzimffhxdld.supabase.co/storage/v1/object/public/thumbnails/references/${tid}-0.jpg` : '');

      const tagsHtml = (p.tags||[]).map(t => `<span class="pg-badge">${t}</span>`).join('');
      const promptText = (p.prompt||'').replace(/\n/g,' ').substring(0,240);

      const card = document.createElement('div');
      card.className = 'pg-card';

      card.innerHTML = `
        <div class="pg-thumb">
          ${imgSrc
            ? `<img src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="pg-thumb-ph" ${imgSrc ? 'style="display:none"' : ''}>
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </div>
          <div class="pg-play">
            <svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="25" fill="rgba(0,0,0,.55)"/><polygon points="20,15 38,25 20,35" fill="white"/></svg>
          </div>
        </div>
        <div class="pg-body">
          <div class="pg-badges">${tagsHtml}</div>
          <p class="pg-prompt">${promptText}</p>
          <div class="pg-actions">
            <button class="pg-btn gold" data-action="watch">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              영상 보기
            </button>
            <button class="pg-btn" data-action="copy">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              복사
            </button>
          </div>
        </div>`;

      card.querySelector('[data-action="watch"]').onclick = (e) => { e.stopPropagation(); openModal(p); };
      card.querySelector('[data-action="copy"]').onclick  = (e) => { e.stopPropagation(); copyPrompt(p, e.currentTarget); };
      card.onclick = () => openModal(p);
      return card;
    }

    // ── 페이지네이션 ──
    function renderPagination(total) {
      const pages = Math.ceil(total / PAGE_SIZE);
      const wrap = document.getElementById('pg-pagination');
      wrap.innerHTML = '';
      if (pages <= 1) return;

      const mk = (label, page, disabled, active) => {
        const btn = document.createElement('button');
        btn.className = 'pg-page-btn' + (active ? ' active' : '');
        btn.textContent = label;
        btn.disabled = disabled;
        btn.onclick = () => { currentPage = page; renderPage(); };
        return btn;
      };

      wrap.appendChild(mk('‹ 이전', currentPage-1, currentPage===1, false));

      const range = [];
      for (let i = Math.max(1,currentPage-2); i <= Math.min(pages,currentPage+2); i++) range.push(i);
      if (range[0] > 1) { wrap.appendChild(mk('1',1,false,false)); if(range[0]>2) wrap.appendChild(Object.assign(document.createElement('span'),{textContent:'…',style:'padding:0 .4rem;color:var(--text-muted)'})); }
      range.forEach(n => wrap.appendChild(mk(n, n, false, n===currentPage)));
      if (range[range.length-1] < pages) { if(range[range.length-1]<pages-1) wrap.appendChild(Object.assign(document.createElement('span'),{textContent:'…',style:'padding:0 .4rem;color:var(--text-muted)'})); wrap.appendChild(mk(pages,pages,false,false)); }

      wrap.appendChild(mk('다음 ›', currentPage+1, currentPage===pages, false));
    }

    // ── 복사 ──
    function copyPrompt(p, btn) {
      navigator.clipboard.writeText(p.prompt||'').then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '✓ 복사됨';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 복사';
        }, 2200);
      });
    }

    // ── 모달 ──
    let currentPrompt = null;
    function openModal(p) {
      currentPrompt = p;
      const tid = p.twitterUrl?.match(/\/status\/(\d+)/)?.[1];

      document.getElementById('pg-modal-tags').innerHTML =
        (p.tags||[]).map(t => `<span class="pg-badge">${t}</span>`).join('');
      document.getElementById('pg-modal-prompt').textContent = p.prompt || '프롬프트 없음';
      document.getElementById('pg-modal-actions').innerHTML = `
        <button class="pg-btn" id="modal-copy-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          프롬프트 복사
        </button>
        ${p.twitterUrl ? `<a class="pg-btn" href="${p.twitterUrl}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.259 5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X에서 보기
        </a>` : ''}`;

      document.getElementById('modal-copy-btn').onclick = function() { copyPrompt(p, this); };

      // Twitter 임베드
      const videoWrap = document.getElementById('pg-modal-video');
      videoWrap.innerHTML = `<div class="tw-loading">영상 로딩 중...</div>`;
      document.getElementById('pg-modal-bg').classList.add('open');
      document.body.style.overflow = 'hidden';

      if (tid) {
        setTimeout(() => {
          videoWrap.innerHTML = `<div class="tw-wrap" id="tw-${tid}"></div>`;
          const target = document.getElementById('tw-'+tid);
          if (window.twttr?.widgets) {
            window.twttr.widgets.createTweet(tid, target, { theme: 'dark', dnt: true, conversation: 'none' })
              .then(el => {
                if (!el) showFallback(videoWrap, p.twitterUrl);
              });
          } else {
            showFallback(videoWrap, p.twitterUrl);
          }
        }, 250);
      } else {
        videoWrap.innerHTML = `<div class="tw-loading"><p style="font-size:.85rem">영상 링크 없음</p></div>`;
      }
    }

    function showFallback(wrap, url) {
      wrap.innerHTML = `<div class="tw-loading">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="rgba(255,255,255,.3)"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.259 5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <p style="margin-top:.6rem;font-size:.82rem">트윗을 불러올 수 없습니다.</p>
        <a href="${url}" target="_blank" rel="noopener" style="color:#D4AF37;font-size:.8rem;margin-top:.5rem;display:block;">X(트위터)에서 직접 보기 →</a>
      </div>`;
    }

    function closeModal() {
      document.getElementById('pg-modal-bg').classList.remove('open');
      document.body.style.overflow = '';
      document.getElementById('pg-modal-video').innerHTML = '';
    }

    document.getElementById('pg-modal-close').onclick = closeModal;
    document.getElementById('pg-modal-bg').onclick = e => { if (e.target===e.currentTarget) closeModal(); };
    document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

    document.getElementById('pg-search').addEventListener('input', e => {
      searchQuery = e.target.value.trim();
      currentPage = 1;
      applyFilters();
    });

    document.getElementById('pg-sort').addEventListener('change', e => {
      if (e.target.value === 'az') filtered.sort((a,b)=>(a.prompt||'').localeCompare(b.prompt||''));
      else filtered = [...ALL].filter((p) => {
        const tags = (p.tags||[]).map(t=>t.toLowerCase());
        const matchG = activeGenre==='all'||tags.includes(activeGenre.toLowerCase());
        const matchS = activeStyle==='all'||tags.includes(activeStyle.toLowerCase());
        const q = searchQuery.toLowerCase();
        const matchQ = !q||(p.prompt||'').toLowerCase().includes(q);
        return matchG&&matchS&&matchQ;
      });
      currentPage = 1;
      renderPage();
    });

    function initReveal() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
      }, { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }

    loadData();
    </script>
</body>
</html>
